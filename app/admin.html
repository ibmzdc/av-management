<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZDC 2026 Fall — AV Admin</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:13px;line-height:1.5;color:#1f2328;background:#f7f8fa;min-height:100vh}
a{color:#3b82d4;text-decoration:none}
/* Top bar */
.topbar{background:#1f2328;color:#fff;padding:0 20px;display:flex;align-items:center;gap:16px;height:48px;position:sticky;top:0;z-index:100}
.topbar .logo{font-weight:700;font-size:14px;letter-spacing:.02em}
.topbar .event{font-size:12px;color:#9ca3af;flex:1}
.topbar button{font-size:12px;font-weight:600;padding:5px 12px;border-radius:4px;border:none;cursor:pointer}
.btn-save{background:#3b82d4;color:#fff}
.btn-save:hover{background:#2563eb}
.btn-save:disabled{background:#374151;color:#9ca3af;cursor:not-allowed}
.btn-token{background:#374151;color:#e5e7eb}
.btn-token:hover{background:#4b5563}
.save-status{font-size:11px;color:#9ca3af;min-width:180px;text-align:right}
.save-status.ok{color:#4ade80}
.save-status.err{color:#f87171}
/* Layout */
.layout{display:flex;gap:0;min-height:calc(100vh - 48px)}
/* Sidebar */
.sidebar{width:180px;flex-shrink:0;background:#fff;border-right:1px solid #e5e7eb;padding:16px 0;position:sticky;top:48px;height:calc(100vh - 48px);overflow-y:auto}
.sidebar h3{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;padding:0 14px 8px}
.day-link{display:block;padding:7px 14px;font-size:12.5px;color:#374151;cursor:pointer;border-left:3px solid transparent}
.day-link:hover{background:#f7f8fa;color:#1f2328}
.day-link.active{background:#eff6ff;color:#1d4ed8;border-left-color:#3b82d4;font-weight:600}
.day-stats{font-size:10.5px;color:#9ca3af;margin-left:4px}
/* Main */
.main{flex:1;padding:24px;overflow-y:auto}
/* Token modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:15px;font-weight:700;margin-bottom:8px}
.modal p{font-size:12.5px;color:#57606a;margin-bottom:14px}
.modal input{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;font-family:monospace;margin-bottom:14px}
.modal input:focus{outline:2px solid #3b82d4;border-color:#3b82d4}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
/* Stats bar */
.stats-bar{display:flex;gap:16px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:12px 16px;margin-bottom:20px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .val{font-size:18px;font-weight:700;color:#1f2328;line-height:1}
.stat .lbl{font-size:10.5px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.stat-divider{width:1px;background:#e5e7eb;align-self:stretch}
/* Day section */
.day-section{margin-bottom:32px}
.day-section h2{font-size:15px;font-weight:700;margin-bottom:12px;color:#1f2328}
/* Session card */
.session-card{background:#fff;border:1px solid #e5e7eb;border-radius:6px;margin-bottom:10px;overflow:hidden}
.session-card.in-dashboard{border-left:3px solid #3b82d4}
.session-head{display:grid;grid-template-columns:80px minmax(0,1fr) 110px 130px 120px 36px 110px;gap:10px;align-items:start;padding:10px 14px}
.session-head:hover{background:#fafafa}
/* Dashboard toggle */
.dash-toggle{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px}
.dash-toggle label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9ca3af;cursor:pointer;text-align:center;line-height:1.2}
.dash-toggle input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#3b82d4}
.session-time{font-size:11.5px;color:#57606a;white-space:nowrap;font-variant-numeric:tabular-nums;padding-top:2px}
.session-info{min-width:0}
.session-title{font-weight:600;font-size:13px;color:#1f2328;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.session-meta{font-size:11px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Inline meta columns */
.session-col{font-size:11.5px;color:#374151;min-width:0}
.session-col .col-label{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin-bottom:2px}
.session-col .col-val{display:block;word-break:break-word}
.session-badges{display:flex;gap:5px;align-items:flex-start;padding-top:2px;flex-wrap:nowrap}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;border-radius:20px;padding:2px 8px}
.badge-type{background:#f3f4f6;color:#374151}
.badge-approved{background:#dcfce7;color:#15803d}
.badge-updated{background:#dbeafe;color:#1d4ed8}
.badge-onhold{background:#fef3c7;color:#92400e}
.badge-nofile{background:#f3f4f6;color:#6b7280}
.badge-missing{background:#fee2e2;color:#b91c1c}
.badge-av{background:#ede9fe;color:#6d28d9}
.badge-distributed{background:#f3e8ff;color:#7c3aed}
.chevron{font-size:10px;color:#9ca3af;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
/* Session body */
.session-body{display:none;border-top:1px solid #e5e7eb;padding:14px}
.session-body.open{display:block}
/* AV details button on row */
.btn-av-details{font-size:11px;font-weight:600;padding:3px 10px;border-radius:4px;border:1px solid #d1d5db;background:#fff;cursor:pointer;color:#374151;white-space:nowrap}
.btn-av-details:hover{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
/* AV requirements grid */
.av-reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.av-req{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:4px;padding:8px 10px}
.av-req .k{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin-bottom:4px}
.av-req input[type=text],.av-req select,.av-req textarea{width:100%;padding:4px 7px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;background:#fff;font-family:inherit;color:#1f2328}
.av-req input[type=text]:focus,.av-req select:focus,.av-req textarea:focus{outline:2px solid #3b82d4;border-color:#3b82d4}
.av-req textarea{resize:vertical;min-height:46px}
.av-req-check{display:flex;align-items:center;gap:6px;padding:5px 0}
.av-req-check input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#3b82d4}
.av-req-check label{font-size:12px;color:#1f2328;cursor:pointer}
/* Files section */
.files-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.files-header span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#57606a}
.btn-add-file{font-size:11px;font-weight:600;padding:3px 10px;border-radius:4px;border:1px solid #d1d5db;background:#fff;cursor:pointer;color:#374151}
.btn-add-file:hover{background:#f3f4f6}
/* File row */
.file-row{display:grid;grid-template-columns:130px 1fr 130px auto;gap:8px;align-items:center;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:4px;padding:8px 10px;margin-bottom:6px}
.file-row select,.file-row input{padding:5px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;background:#fff;font-family:inherit}
.file-row select:focus,.file-row input:focus{outline:2px solid #3b82d4;border-color:#3b82d4}
.file-row input[type=text]{width:100%}
.btn-remove{font-size:16px;color:#9ca3af;background:none;border:none;cursor:pointer;line-height:1;padding:2px 4px}
.btn-remove:hover{color:#ef4444}
/* Notes row */
.notes-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.notes-row label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#57606a;margin-bottom:4px}
.notes-row textarea{width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;resize:vertical;min-height:56px;font-family:inherit}
.notes-row textarea:focus{outline:2px solid #3b82d4;border-color:#3b82d4}
/* Empty state */
.no-file{font-size:12px;color:#9ca3af;font-style:italic;padding:6px 0}
/* Buttons */
.btn{font-size:12px;font-weight:600;padding:5px 12px;border-radius:4px;border:none;cursor:pointer}
.btn-primary{background:#3b82d4;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-sm{font-size:11px;padding:3px 9px}
</style>
</head>

    <div class="modal-btns">

  </div>
</div>

<!-- Top bar -->
<div class="topbar">

  <button class="btn-dl btn" id="dlBtn" onclick="downloadJSON()" disabled style="background:#374151;color:#e5e7eb">↓ Download JSON</button>

</div>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <h3>Event Days</h3>
    <div id="daynav"></div>
  </nav>

  <!-- Main -->
  <main class="main" id="main">
    <div id="statsBar" class="stats-bar" style="display:none"></div>
    <div id="content"></div>
  </main>
</div>

 and side tables, schoolroom 240","projection":"not required","microphones":"5 wireless mics plus 3 catchboxes","podium":true,"timer":null,"monitor":"2 monitors for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-teun-untitled","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"17:00","sessionType":"Client Roundtable","track":null,"title":"(Untitled)","description":null,"speakers":null,"room":"Teun","roomSetup":"Stage with podium, 4 soft chairs and side tables, schoolroom 240","projection":"not required","microphones":"5 wireless mics plus 3 catchboxes","podium":true,"timer":null,"monitor":"2 monitors for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-ibm-atlas-system-intelligen","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"IBM Atlas: System intelligence that discovers everything so you can understand anything","description":"See IBM Atlas in action as it discovers and maps relationships across your IT environment, from hardware and operating systems to middleware, software, and business applications. Through a live demonstration, attendees will explore Atlas’s dynamic topology visualization and AI-powered chat experience, enabling users to quickly understand dependencies, answer environment questions, and gain actionable insights. Learn how organizations are leveraging Atlas for change management, audit readiness, application refactoring, business service mapping, and drift detection, while also helping shape the future of the platform through direct feedback.","speakers":"Meghan McGrath","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-would-you-trust-an-ai-agent","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Would You Trust an AI Agent With This?","description":"Experience Agentic AI in action within IBM Concert for Z and see how AI can accelerate problem determination by analyzing system signals, identifying likely causes, gathering evidence, and recommending next steps. After the live demonstration, participate in a quick interactive voting exercise where you'll decide whether specific operational tasks should be automated by AI, assisted by AI, or remain under human control. This engaging session explores the evolving relationship between human expertise and AI-driven operations, highlighting how Agentic AI can help address knowledge gaps,reduce reliance on specialized experts, and improve decision-making across complex environments. Attendees will gain insight into the practical applications of autonomous operations while helping shape the future direction of Concert for Z's Agentic AI capabilities.","speakers":"Nadia Fendrich","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-project-brain-bank-turning","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Project Brain Bank: Turning IBM Z knowledge into trusted AI-ready guidance","description":"Discover Project Brain Bank, an early concept for transforming scattered IBM Z knowledge—from documentation and support insights to product expertise and operational learnings—into structured, AI-generated guidance backed by trusted sources. Attendees will see a simple before-and-after demonstration showing how information can be consolidated into actionable answers with supporting evidence, recommended next steps, and source transparency. Visitors will be invited to evaluate an AI-generated response and share what would make it trustworthy enough for real-world use. Through a quick interactive activity, participants will help shape the future of AI-assisted IBM Z guidance by identifying the trust signals, evidence, and transparency mechanisms needed to confidently leverage AI in enterprise environments.","speakers":"Ivan Dovgan","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-software-management-as-code","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Software Management-as-Code - IBM Z Install","description":"Experience a hands-on demonstration of IBM Z Install and see how software management can be transformed through a GitOps-driven, software management-as-code approach. Attendees will explore a prototype that uses standard repositories to configure, deploy, and track z/OS software across partitions, providing a centralized inventory of what is installed, where it is running, and how it was deployed. The session showcases a self-service, AI-assisted experience that brings together software installation, governance, and auditability using industry-standard workflows. Learn how IBM is extending Infrastructure-as-Code, Configuration-as-Code, and Policy-as-Code principles to z/OS software management, helping organizations improve visibility, streamline operations, and accelerate time to value while maintaining business controls and compliance.","speakers":"Andrew Sica","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-ibm-project-polaris-tech-pre","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"IBM Project Polaris Tech Preview 2.0 and Beyond","description":"Explore how IBM Project Polaris is extending As-Code practices across z/OS, moving beyond isolated configuration tasks to support Networking, Storage Management, Workload Manager (WLM), and other core system domains. Through a hands-on demonstration, attendees will see how configurations and policies can be defined, validated, and managed using modern workflows, with guidance from intelligent automation and agentic AI. The session highlights how Polaris helps both new and experienced system programmers adopt industry-standard As-Code approaches to improve consistency, governance, reviewability, and confidence when managing change. Visitors will have the opportunity to interact with the experience, provide feedback, and help shape the future of As-Code management for enterprise z/OS environments.","speakers":"Roger Bales","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-workload-expansion-the-futu","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Workload Expansion: The Future of IBM Z","description":"As organizations seek to modernize and consolidate more workloads within their existing data center footprint, the IBM Z ecosystem is evolving to support new architectures, deployment models, and development patterns. This interactive exhibit explores IBM’s vision for a more secure, scalable, and versatile platform, highlighting how emerging technologies—including architectures such as ARM—can complement traditional workloads and create new opportunities for innovation on IBM Z. Attendees will participate in collaborative activities designed to uncover new use cases, identify adoption opportunities, and explore where hybrid architectures could deliver the greatest business value. Participants will help shape the direction of an expanded IBM Z ecosystem that brings together mission-critical reliability with modern application and infrastructure experiences.","speakers":"Anthony Cocuzza","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-from-client-configuration-da","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"From Client Configuration Data to Simplification Signals","description":"The IBM Z Configuration Collection Program demonstrates how real-world client configuration data can be used to identify opportunities for simplification across the platform. This exhibit showcases how IBM has analyzed customer configuration data and identified a subset of configuration settings as candidates for simplification, helping teams better understand where complexity exists and where focused improvements may provide the greatest value. Attendees will see how these insights are already being used to inform IBM Z simplification efforts and explore how configuration intelligence could influence future capabilities such as Project Polaris and the z/OS configuration registry. Visitors will also have the opportunity to discuss their own configuration challenges and help shape future priorities for reducing friction, improving usability, and simplifying system management.","speakers":"Shelley Brand","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-18-00-ballroom-foyer-reception","day":"Monday","date":"2026-10-19","startTime":"18:00","endTime":"19:00","sessionType":"Networking","track":null,"title":"Reception","description":null,"speakers":null,"room":"Ballroom Foyer","roomSetup":"High top tables","projection":null,"microphones":null,"podium":false,"timer":null,"monitor":null,"specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"tuesday-07-30-restaurant-breakfast","day":"Tuesday","date":"2026-10-20","startTime":"07:30","endTime":"08:30","sessionType":"Meal","track":null,"title":"Breakfast","description":null,"speakers":null,"room":"Restaurant","roomSetup":"See seating plan","projection":null,"microphones":null,"podium":false,"timer":null," // ── Load ─────────────────────────────────────────────────────────────────────
async function load(){
  setStatus("Loading…", "");

  // Tier 1: GitHub Contents API (gives us FILE_SHA for saves + freshest data)
  if(getToken()){
    try {
      const r = await fetch(API_URL, {
        headers:{ "Accept":"application/vnd.github.v3+json", "Authorization":"token "+getToken() }
      });
      if(r.ok){
        const meta = await r.json();
        FILE_SHA = meta.sha;
        DATA = JSON.parse(atob(meta.content.replace(/\n/g,"")));
        render();
        setStatus("Loaded · " + DATA.sessions.length + " sessions", "ok");
        return;
      }
    } catch(_){}
  }

  // Tier 2: Relative path (works when served via local HTTP server or GitHub Pages)
  try {
    const r = await fetch("../data/av-data.json?t=" + Date.now());
    if(r.ok){
      DATA = await r.json();
      render();
      setStatus("Loaded (local) · " + DATA.sessions.length + " sessions · set token to enable save", "");
      return;
    }
  } catch(_){}

  // Tier 3: Inline embedded data (always works, even from file://)
  try {
    if (typeof EMBEDDED_DATA !== "undefined" && EMBEDDED_DATA.sessions) {
      DATA = EMBEDDED_DATA;
      render();
      setStatus("Loaded (embedded) · " + DATA.sessions.length + " sessions · set token to save to GitHub", "");
      return;
    }
  } catch(_){}
  setStatus("Error: could not load session data", "err");
}

// ── Mark dirty ───────────────────────────────────────────────────────────────
function markDirty(){
  DIRTY = true;
  document.getElementById("dlBtn").disabled = false;
  document.getElementById("saveBtn").disabled = !getToken();
  setStatus("Unsaved changes", "");
}

// ── Download JSON (local testing — no token needed) ───────────────────────────
function downloadJSON(){
  collectFormState();
  DATA.lastUpdated = new Date().toISOString();
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url;
  a.download = "av-data.json";
  a.click();
  URL.revokeObjectURL(url);
  setStatus("Downloaded av-data.json — copy to av-management/data/", "ok");
}

// ── Save to GitHub ────────────────────────────────────────────────────────────
async function saveAll(){
  if(!getToken()){ showTokenModal(); return; }
  setStatus("Saving…", "");
  document.getElementById("saveBtn").disabled = true;
  // Collect form state back into DATA
  collectFormState();
  DATA.lastUpdated = new Date().toISOString();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
  const body = { message: `AV data update — ${fmtNow()}`, content, branch: BRANCH };
  if(FILE_SHA) body.sha = FILE_SHA;
  try {
    const r = await fetch(API_URL, {
      method:"PUT",
      headers:{ "Authorization":`token ${getToken()}`, "Content-Type":"application/json" },
      body: JSON.stringify(body)
    });
    if(!r.ok){ const t=await r.text(); throw new Error(`GitHub ${r.status}: ${t}`); }
    const j = await r.json();
    FILE_SHA = j.content.sha;
    DIRTY = false;
    setStatus("Saved · " + fmtNow(), "ok");
    document.getElementById("saveBtn").disabled = false;
  } catch(e){
    setStatus("Save failed: "+e.message, "err");
    document.getElementById("saveBtn").disabled = false;
  }
}

function fmtNow(){
  const d = new Date();
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " at " +
    d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:false});
}

function setStatus(msg, cls){
  const el = document.getElementById("saveStatus");
  el.textContent = msg;
  el.className = "save-status" + (cls ? " "+cls : "");
}

// ── Render ───────────────────────────────────────────────────────────────────
const DAY_ORDER = ["Sunday","Monday","Tuesday","Wednesday","Thursday"];

function render(){
  renderStats();
  renderDayNav();
  renderContent();
}

function renderStats(){
  const bar = document.getElementById("statsBar");
  let total=0, approved=0, updated=0, onhold=0, distributed=0, missing=0;
  for(const s of DATA.sessions){
    if(s.files.length===0 && s.sessionType !== "Z Design Fair") missing++;
    for(const f of s.files){
      total++;
      if(f.status==="approved")     approved++;
      else if(f.status==="updated")     updated++;
      else if(f.status==="onhold")      onhold++;
      else if(f.status==="distributed") distributed++;
    }
  }
  bar.style.display="flex";
  bar.innerHTML = `
    <div class="stat"><div class="val">${DATA.sessions.length}</div><div class="lbl">Sessions</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="val">${total}</div><div class="lbl">Files tracked</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="val" style="color:#15803d">${approved}</div><div class="lbl">Approved</div></div>
    <div class="stat"><div class="val" style="color:#1d4ed8">${updated}</div><div class="lbl">Updated</div></div>
    <div class="stat"><div class="val" style="color:#92400e">${onhold}</div><div class="lbl">On Hold</div></div>
    <div class="stat"><div class="val" style="color:#7c3aed">${distributed}</div><div class="lbl">Distributed</div></div>
    <div class="stat-divider"></div>
    <div class="stat"><div class="val" style="color:${missing>0?"#b91c1c":"#9ca3af"}">${missing}</div><div class="lbl">Missing Files</div></div>
  `;
}

function renderDayNav(){
  const nav = document.getElementById("daynav");
  const days = getDays();
  nav.innerHTML = days.map(day => {
    const sessions = DATA.sessions.filter(s=>s.day===day);
    const files = sessions.flatMap(s=>s.files);
    const done = files.filter(f=>f.status==="approved"||f.status==="distributed").length;
    return `<a class="day-link" id="nav-${day}" onclick="scrollToDay('${day}')" href="#">
      ${day} <span class="day-stats">${done}/${files.length}</span>
    </a>`;
  }).join("");
}

function getDays(){
  const seen = new Set();
  const out = [];
  for(const s of DATA.sessions){
    if(!seen.has(s.day)){ seen.add(s.day); out.push(s.day); }
  }
  return out.sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b));
}

function renderContent(){
  const cont = document.getElementById("content");
  const days = getDays();
  cont.innerHTML = days.map(day => renderDay(day)).join("");
}

function renderDay(day){
  const sessions = DATA.sessions.filter(s=>s.day===day);
  const dateStr = sessions[0]?.date ? new Date(sessions[0].date+"T12:00:00Z").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}) : day;
  return `<div class="day-section" id="day-${day}">
    <h2>${dateStr}</h2>
    ${sessions.map(s=>renderSession(s)).join("")}
  </div>`;
}

function fileStatusBadge(files){
  if(!files || files.length===0) return `<span class="badge badge-missing">No file</span>`;
  const statuses = files.map(f=>f.status);
  const parts = [];
  const cnt = (st) => statuses.filter(s=>s===st).length;
  if(cnt("distributed")) parts.push(`<span class="badge badge-distributed">✓ ${cnt("distributed")} Distributed</span>`);
  if(cnt("approved"))    parts.push(`<span class="badge badge-approved">✓ ${cnt("approved")} Approved</span>`);
  if(cnt("updated"))     parts.push(`<span class="badge badge-updated">↑ ${cnt("updated")} Updated</span>`);
  if(cnt("onhold"))      parts.push(`<span class="badge badge-onhold">⏸ ${cnt("onhold")} On Hold</span>`);
  if(cnt("nofile"))      parts.push(`<span class="badge badge-nofile">${cnt("nofile")} No File Needed</span>`);
  if(cnt("pending"))     parts.push(`<span class="badge badge-missing">${cnt("pending")} Pending</span>`);
  return parts.join(" ");
}

// ── Interactions ──────────────────────────────────────────────────────────────
function onDashToggle(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  s.showInDashboard = document.getElementById("dash-"+sessionId).checked;
  // Update card border live
  document.getElementById("card-"+sessionId).classList.toggle("in-dashboard", s.showInDashboard);
  markDirty();
}

function toggleCard(id){
  const body = document.getElementById("body-"+id);
  const chev = document.getElementById("chev-"+id);
  body.classList.toggle("open");
  chev.classList.toggle("open");
}

function addFile(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  s.files.push({ fileType:"presentation", fileName:"", boxFileId:"", status:"pending", updatedAt:null });
  document.getElementById("files-"+sessionId).innerHTML = renderFiles(s);
  markDirty();
}

function removeFile(sessionId, idx){
  collectSessionFiles(sessionId);
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  const old = s.files[idx];
  if(old && old.fileName) appendChangelog(s, old.fileType, old.status, "removed");
  s.files.splice(idx,1);
  document.getElementById("files-"+sessionId).innerHTML = renderFiles(s);
  updateCardBadges(sessionId);
  markDirty();
}

function onStatusChange(sessionId, idx){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s||!s.files[idx]) return;
  const oldStatus = s.files[idx].status;
  const newStatus = document.getElementById(`fstatus-${sessionId}-${idx}`).value;
  s.files[idx].status = newStatus;
  s.files[idx].updatedAt = new Date().toISOString();
  if(oldStatus !== newStatus) appendChangelog(s, s.files[idx].fileType||"file", oldStatus, newStatus);
  updateCardBadges(sessionId);
  markDirty();
}

function collectSessionFiles(sessionId){
  const s = DATA.sessions.find(x=>x.id===sessionId);
  if(!s) return;
  s.files = s.files.map((f,i)=>({
    fileType:  document.getElementById(`ftype-${sessionId}-${i}`)?.value || f.fileType,
    fileName:  document.getElementById(`fname-${sessionId}-${i}`)?.value.trim() || f.fileName,
    boxFileId: document.getElementById(`fboxid-${sessionId}-${i}`)?.value.trim() || f.boxFileId,
    status:    document.getElementById(`fstatus-${sessionId}-${i}`)?.value || f.status,
    updatedAt: f.updatedAt
  }));
}

function collectFormState(){
  for(const s of DATA.sessions){
    const cb = document.getElementById("dash-"+s.id);
    if(cb) s.showInDashboard = cb.checked;
    collectAVReqs(s.id);
    collectSessionFiles(s.id);
    const an = document.getElementById("avnote-"+s.id);
    const on = document.getElementById("opnote-"+s.id);
    if(an) s.avNote = an.value.trim()||null;
    if(on) s.operatorNote = on.value.trim()||null;
  }
}

function updateCardBadges(sessionId){
  // Only refresh the stats bar — the session row HTML is not rebuilt dynamically.
  // File status badges are shown inside the expanded panel, not on the collapsed row.
  renderStats();
  renderDayNav();
}

function appendChangelog(session, fileType, oldStatus, newStatus){
  if(!DATA.changelog) DATA.changelog=[];
  DATA.changelog.unshift({
    ts: new Date().toISOString(),
    sessionId: session.id,
    sessionTitle: session.title,
    day: session.day,
    fileType,
    oldStatus,
    newStatus
  });
  if(DATA.changelog.length > 50) DATA.changelog = DATA.changelog.slice(0,50);
}

function scrollToDay(day){
  const el = document.getElementById("day-"+day);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  document.querySelectorAll(".day-link").forEach(l=>l.classList.remove("active"));
  const link = document.getElementById("nav-"+day);
  if(link) link.classList.add("active");
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", ()=>{
  if(!getToken()) showTokenModal();
  else document.getElementById("saveBtn").disabled = false;
  load();

  // Highlight active day in sidebar on scroll
  window.addEventListener("scroll", ()=>{
    const days = getDays ? getDays() : [];
    for(const day of [...days].reverse()){
      const el = document.getElementById("day-"+day);
      if(el && el.getBoundingClientRect().top <= 80){
        document.querySelectorAll(".day-link").forEach(l=>l.classList.remove("active"));
        document.getElementById("nav-"+day)?.classList.add("active");
        break;
      }
    }
  }, {passive:true});
});
</script>
</body>
