<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV Dashboard — ZDC 2026 Fall</title>
<style>
/* ── Reset & Base ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --surface: #f7f8fa;
  --border: #e5e7eb;
  --text: #1f2328;
  --muted: #57606a;
  --subtle: #9ca3af;
  --accent: #3b82d4;
  --accent-hover: #2563eb;
  --green: #15803d; --green-bg: #dcfce7; --green-border: #86efac;
  --blue:  #1d4ed8; --blue-bg:  #dbeafe; --blue-border:  #93c5fd;
  --amber: #92400e; --amber-bg: #fef3c7; --amber-border: #fcd34d;
  --gray:  #374151; --gray-bg:  #f3f4f6; --gray-border:  #d1d5db;
  --red:   #b91c1c; --red-bg:   #fee2e2; --red-border:   #fca5a5;
  --purple: #6d28d9; --purple-bg: #ede9fe; --purple-border: #c4b5fd;
  --radius: 6px;
}
body { font-family: -apple-system,"Segoe UI",system-ui,sans-serif; font-size: 13px; line-height: 1.5; color: var(--text); background: var(--bg); }

/* ── Header ─────────────────────────────────────────────── */
header { background: #161b22; color: #fff; padding: 0 20px; display: flex; align-items: center; gap: 14px; height: 50px; border-bottom: 1px solid #30363d; }
header h1 { font-size: 14px; font-weight: 700; flex: 1; display: flex; align-items: center; gap: 8px; }
header h1::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.refresh-meta { font-size: 11px; color: #8b949e; text-align: right; line-height: 1.4; }
.refresh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 4px; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.btn-header { font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 5px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; white-space: nowrap; transition: background .1s; }
.btn-header:hover { background: #30363d; }

/* ── Print room rundown ─────────────────────────────────── */
@page { size: landscape; margin: 12mm 14mm; }
@media print {
  /* Force background colors to print */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  /* Hide all app chrome */
  header, .summary-bar, .needs-attention, .left-nav, .right-sidebar,
  .legend-bar, #app, #loading, .prd-dialog-overlay { display: none !important; }
  body { margin: 0; }
  /* Show only the print root */
  .print-rundown-root { display: block !important; }
  .prd-cover { margin-bottom: 18px; border-bottom: 2px solid #1f2328; padding-bottom: 10px; }
  .prd-cover-title { font-size: 15px; font-weight: 700; color: #1f2328; }
  .prd-cover-sub { font-size: 9px; color: #57606a; margin-top: 2px; }
  .prd-room { break-before: page; }
  .prd-room:first-of-type { break-before: avoid; }
  .prd-room-hdr { font-size: 13px; font-weight: 700; color: #ffffff; background: #1f2937; padding: 6px 10px; margin-bottom: 8px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .prd-day-hdr { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #1e3a5f; background: #dbeafe; padding: 4px 10px; margin-top: 8px; margin-bottom: 3px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .print-rundown-root { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .prd-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-bottom: 6px; table-layout: fixed; }
  .prd-table th { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #57606a; border-bottom: 1px solid #d1d5db; padding: 4px 6px; text-align: left; }
  .prd-table td { padding: 6px 10px 6px 6px; border-bottom: 1px solid #e5e7eb; vertical-align: top; line-height: 1.45; word-wrap: break-word; }
  .prd-table tr:last-child td { border-bottom: none; }
  .prd-time  { width: 90px; white-space: nowrap; font-variant-numeric: tabular-nums; color: #374151; font-weight: 600; }
  .prd-title { font-weight: 600; color: #1f2328; font-size: 10px; }
  .prd-speakers { font-size: 9px; color: #57606a; }
  .prd-col-session { width: calc((100% - 90px) / 3); }
  .prd-av  { width: calc((100% - 90px) / 3); font-size: 10px; color: #374151; }
  .prd-av-item { display: block; line-height: 1.7; }
  .prd-files { width: calc((100% - 90px) / 3); }
  .prd-file-row { font-size: 10px; line-height: 1.55; }
  .prd-file-dl  { color: #16a34a; }
  .prd-file-upd { color: #92400e; font-weight: 600; }
  .prd-file-wait { color: #9ca3af; font-style: italic; }
  .prd-note { font-size: 9px; font-weight: 700; color: #92400e; font-style: normal; margin-top: 4px; padding: 2px 4px; border-left: 2px solid #d97706; }
}
.print-rundown-root { display: none; }

/* ── Summary Bar (stat tiles) ────────────────────────────── */
.summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.stat-tile { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 16px; display: flex; flex-direction: column; gap: 4px; transition: box-shadow .15s; }
.stat-tile:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.stat-tile.tile-sessions  { border-top: 3px solid #64748b; }
.stat-tile.tile-files     { border-top: 3px solid var(--accent); }
.stat-tile.tile-approved  { border-top: 3px solid var(--green); }
.stat-tile.tile-updated   { border-top: 3px solid var(--blue); }
.stat-tile.tile-onhold       { border-top: 3px solid #f59e0b; }
.stat-tile.tile-nofile       { border-top: 3px solid var(--red); }
.stat-val { font-size: 22px; font-weight: 700; line-height: 1; display: block; }
.tile-sessions     .stat-val { color: #475569; }
.tile-files        .stat-val { color: var(--accent); }
.tile-approved     .stat-val { color: var(--green); }
.tile-updated      .stat-val { color: var(--blue); }
.tile-onhold       .stat-val { color: #b45309; }
.tile-nofile       .stat-val { color: var(--red); }
.stat-label { font-size: 10px; color: var(--subtle); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; display: block; margin-top: 1px; }
.needs-attention { background: var(--amber-bg); border-bottom: 2px solid var(--amber-border); padding: 8px 20px; font-size: 12px; color: #92400e; font-weight: 600; display: none; }

/* ── Layout ─────────────────────────────────────────────── */
.layout { display: grid; grid-template-columns: 220px 1fr; gap: 0; min-height: calc(100vh - 50px); }
@media(max-width: 1000px){ .layout { grid-template-columns: 160px 1fr; } }
@media(max-width: 700px)  { .layout { grid-template-columns: 1fr; } }

/* ── Left Nav Sidebar ────────────────────────────────────── */
.left-nav { background: var(--bg); border-right: 1px solid var(--border); padding: 16px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.left-nav-section { padding: 0 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.left-nav-section:last-child { border-bottom: none; }
.left-nav-label { font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--subtle); padding: 0 14px 8px; display: block; }
/* Day links */
.day-link { display: block; padding: 7px 14px 4px; font-size: 12.5px; color: #374151; cursor: pointer; border-left: 3px solid transparent; transition: background .1s; text-decoration: none; }
.day-link:hover { background: #f3f4f6; color: var(--text); }
.day-link.active { background: #eff6ff; color: var(--blue); border-left-color: var(--accent); font-weight: 600; }
.day-link-sub { font-size: 10px; color: var(--subtle); font-weight: 400; display: block; margin-top: 1px; font-variant-numeric: tabular-nums; }
/* Room buttons */
.room-nav-btn { display: block; width: 100%; padding: 6px 14px; font-size: 12px; font-weight: 500; color: var(--muted); background: none; border: none; cursor: pointer; text-align: left; border-left: 3px solid transparent; transition: background .1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-nav-btn:hover { background: #f3f4f6; color: var(--text); }
.room-nav-btn.active { background: #eff6ff; color: var(--blue); border-left-color: var(--accent); font-weight: 600; }
.room-nav-count { font-size: 10px; color: var(--subtle); margin-left: 3px; }

/* ── Main content ────────────────────────────────────────── */
.main-content { padding: 20px 24px 40px; min-width: 0; overflow-x: hidden; }

/* ── Day panel ───────────────────────────────────────────── */
.day-panel { display: none; }
.day-panel.active { display: block; }
.day-panel-header { font-size: 13px; font-weight: 700; color: var(--text); padding-bottom: 10px; margin-bottom: 14px; border-bottom: 2px solid var(--border); display: flex; align-items: baseline; gap: 8px; }
.day-panel-date { font-size: 11px; font-weight: 400; color: var(--subtle); }

/* ── Session Blocks ──────────────────────────────────────── */
.session-block { border: 1px solid var(--border); border-left: 4px solid #e5e7eb; border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; transition: border-left-color .2s; }
/* Status-colored left borders */
.session-block.sb-approved   { border-left-color: var(--green); }
.session-block.sb-updated    { border-left-color: var(--blue); }
.session-block.sb-onhold     { border-left-color: #f59e0b; }
.session-block.sb-nofiles    { border-left-color: var(--red); }
.session-block.sb-nofile     { border-left-color: #d1d5db; }
/* Session row */
.session-row { display: grid; grid-template-columns: 76px 1fr 118px 180px; align-items: start; gap: 0 12px; padding: 10px 14px 9px; background: var(--surface); user-select: none; transition: background .15s; }
.session-row:hover { background: #eef0f3; }
.session-time { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.5; }
.session-time .t-start { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.2; }
.session-info { min-width: 0; }
.session-title { font-weight: 600; font-size: 13px; line-height: 1.35; margin-bottom: 3px; }
.session-sub { font-size: 11px; color: var(--subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Room column */
.session-type-col { display: flex; align-items: center; }
.session-room-label { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); margin-bottom: 3px; }
.session-room-val { font-size: 12px; color: var(--text); font-weight: 500; }
.badge-general   { background: #ede9fe; color: #6d28d9; }
.badge-client    { background: #dbeafe; color: #1d4ed8; }
.badge-solution  { background: #dcfce7; color: #15803d; }
.badge-collab    { background: #fef9c3; color: #92400e; }
.badge-fair      { background: #fce7f3; color: #9d174d; }
.badge-roundtable{ background: #e0f2fe; color: #0369a1; }
.badge-playback  { background: #f0fdf4; color: #166534; }
.badge-default   { background: var(--surface); color: var(--muted); }
.av-details-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; white-space: nowrap; user-select: none; transition: all .1s; height: 26px; }
.av-details-btn:hover { background: #f0f4ff; border-color: #93c5fd; color: #1d4ed8; }
.session-block.open .av-details-btn { background: #eff6ff; border-color: #3b82d4; color: #1d4ed8; }
.fs-pill { display: inline-flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; width: 24px; height: 24px; border-radius: 4px; cursor: default; }
.fs-update { background: #fde68a; color: #92400e; animation: dl-pulse 1.6s ease-in-out infinite; }
.fs-new    { background: var(--blue-bg); color: var(--blue); }
.fs-done   { background: var(--green-bg); color: var(--green); }
.fs-hold   { background: var(--amber-bg); color: var(--amber); }
.fs-nofile { background: var(--gray-bg); color: var(--gray); font-size: 10px; }
/* Legend bar */
.legend-bar { display: flex; align-items: center; gap: 14px; padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; flex-wrap: wrap; }
.legend-bar span { font-size: 10.5px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text); }
.legend-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
/* AV panel — mirrors admin av-groups layout, read-only */
.av-groups { display: flex; flex-direction: column; gap: 10px; padding: 4px 0; }
.av-group { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.av-group-hdr { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #f6f8fa; border-bottom: 1px solid var(--border); font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.av-group-hdr .g-icon { font-size: 11px; }
.av-group-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; padding: 10px; }
.av-group-body.av-special { grid-template-columns: 1fr; }
.av-req { background: #f9fafb; border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; }
.av-req.av-req-full { grid-column: 1 / -1; }
.av-req .k { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); margin-bottom: 5px; }
.av-req .v { display: block; font-size: 12px; font-weight: 500; color: var(--text); white-space: pre-wrap; }
.av-req .v-muted { display: block; font-size: 12px; color: var(--subtle); font-style: italic; }
.av-req .v-yes { display: block; font-size: 12px; font-weight: 600; color: var(--green); }
.av-empty { color: var(--muted); font-size: 12px; font-style: italic; }
/* Expanded session body */
.session-expanded { display: none; border-top: 1px solid var(--border); padding: 10px 14px 14px; background: #fff; }
.session-block.open .session-expanded { display: block; }
.chevron { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px; font-size: 11px; color: var(--subtle); transition: transform 0.2s ease; line-height: 1; margin-left: 2px; }
.session-block.open .chevron { transform: rotate(90deg); color: #1d4ed8; }
/* AV Note card */
.av-note-card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.av-note-card .av-group-hdr { background: #f6f8fa; border-bottom: 1px solid var(--border); }
.av-note-card .av-note-body { padding: 10px; font-size: 12px; color: var(--text); white-space: pre-wrap; line-height: 1.5; }

/* ── Files Table ─────────────────────────────────────────── */
.files-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.files-table th { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.files-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.files-table tr:last-child td { border-bottom: none; }
.status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
.pill-approved     { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.pill-updated      { background: var(--blue-bg);  color: var(--blue);  border: 1px solid var(--blue-border); }
.pill-onhold       { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.pill-nofile       { background: var(--gray-bg);  color: var(--gray);  border: 1px solid var(--gray-border); }

/* ── Download button states ───────────────────────────────── */
.dl-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: 5px; padding: 4px 12px; text-decoration: none; white-space: nowrap; cursor: pointer; border: none; transition: filter .1s; }
.dl-btn:hover { filter: brightness(.92); text-decoration: none; }
.dl-new      { background: var(--accent); color: #fff; }
.dl-done     { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.dl-update   { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); animation: dl-pulse 1.6s ease-in-out infinite; }
.dl-nolink   { color: var(--muted); font-size: 11.5px; font-style: italic; }
@keyframes dl-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* AV table key cells */
.chip-k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); padding: 5px 12px 5px 0; width: 120px; vertical-align: top; white-space: nowrap; }
.av-note { margin-top: 10px; padding: 8px 10px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: var(--radius); font-size: 12px; color: #78350f; }
.av-note strong { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #92400e; margin-bottom: 2px; }
.no-files-msg { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }

.session-block.room-hidden { display: none; }

/* ── Changelog (in left nav) ──────────────────────────────── */
.changelog-list { list-style: none; }
.changelog-item { padding: 7px 14px; border-bottom: 1px solid var(--border); }
.changelog-item:last-child { border-bottom: none; }
.cl-ts { font-size: 10px; color: var(--subtle); }
.cl-session { font-size: 11px; font-weight: 600; margin: 2px 0 1px; }
.cl-detail { font-size: 10.5px; color: var(--muted); }
.cl-pill { font-size: 9.5px; font-weight: 700; border-radius: 3px; padding: 1px 5px; display: inline-block; }
.cl-pill-from { background: var(--gray-bg); color: var(--gray); }
.cl-pill-to-approved { background: var(--green-bg); color: var(--green); }
.cl-pill-to-updated  { background: var(--blue-bg);  color: var(--blue); }
.cl-pill-to-onhold   { background: var(--amber-bg); color: var(--amber); }
.cl-empty { color: var(--muted); font-size: 11px; font-style: italic; padding: 6px 14px; display: block; }

/* ── Loading / Error ─────────────────────────────────────── */
#loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Print dialog ────────────────────────────────────────── */
.prd-dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9999; display: flex; align-items: center; justify-content: center; }
.prd-dialog { background: #fff; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.18); width: 340px; padding: 20px 24px 18px; }
.prd-dialog-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
.prd-dialog-body { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
.prd-dialog-opt { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 13px; color: var(--text); }
.prd-dialog-opt input { margin-top: 2px; flex-shrink: 0; }
.prd-dialog-footer { display: flex; justify-content: flex-end; gap: 8px; }
.prd-dialog-cancel { font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 5px; border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; }
.prd-dialog-cancel:hover { background: var(--surface); }
.prd-dialog-print { font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 5px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
.prd-dialog-print:hover { background: var(--accent-hover); }
</style>
</head>
<body>

<header>
  <h1>AV Dashboard — ZDC 2026 Fall · Antwerp</h1>
  <button class="btn-header" id="refreshBtn" onclick="manualRefresh()">↺ Refresh Now</button>
  <button class="btn-header" onclick="showPrintDialog()">🖨 Print Rundown</button>
  <div class="refresh-meta">
    <span class="refresh-dot"></span><span id="last-refresh">Loading…</span><br>
    Auto-refreshes every 60 s
  </div>
</header>

<div class="summary-bar" id="summary-bar" style="display:none">
  <div class="stat-tile tile-sessions"><span class="stat-val" id="s-sessions">–</span><span class="stat-label">Sessions</span></div>
  <div class="stat-tile tile-files"><span class="stat-val" id="s-files">–</span><span class="stat-label">Files Tracked</span></div>
  <div class="stat-tile tile-approved"><span class="stat-val" id="s-approved">–</span><span class="stat-label">Uploaded</span></div>
  <div class="stat-tile tile-updated"><span class="stat-val" id="s-updated">–</span><span class="stat-label">Updated</span></div>
  <div class="stat-tile tile-nofile"><span class="stat-val" id="s-nofile">–</span><span class="stat-label">Awaiting File</span></div>
</div>

<div class="needs-attention" id="needs-attention"></div>

<div id="loading"><span class="spinner"></span>Loading session data…</div>

<div id="app" style="display:none">
  <div class="layout">
    <!-- Left nav: day + room selection + changelog -->
    <nav class="left-nav" id="left-nav">
      <div class="left-nav-section" id="nav-days">

owing need for AI-driven vulnerability scanning, approaches to planning and prioritizing IBM security patches, and how continuous security monitoring strengthens governance, auditability, and developer professional's accountability. Join us to learn how leading enterprises are adapting their IBM Z security strategies to stay resilient in the age of AI.","speakers":"Pradeep Parameshwaran","room":"Teun","roomSetup":null,"projection":"not required","microphones":"2 handheld mics","podium":true,"timer":null,"monitor":"2 monitors for speaker","specialReqs":null,"showInDashboard":true,"av":{"presentationRequired":true,"presentationSource":"Presenter Laptop","clicker":false,"confidenceMonitors":0,"timerMins":0,"wirelessHandheldMics":2,"lavalierHeadsetMics":1,"catchBoxMics":0,"audioPlayback":false,"xlrAudioFeed":true,"projector":false,"videoPlayback":false,"podium":true,"panelChairs":0,"sideTables":0,"highTopTables":0,"easel":false,"flipChart":false,"roomSetup":null,"stageSetup":null,"specialRequirements":[]},"files":[],"avNote":null,"operatorNote":null,"stageSetup":null},{"id":"monday-16-15-ballroom-foyer-ibm-atlas-system-intelligen","day":"Monday","date":null,"startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"IBM Atlas: System intelligence that discovers everything so you can understand anything","description":"See IBM Atlas in action as it discovers and maps relationships across your IT environment, from hardware and operating systems to middleware, software, and business applications. Through a live demonstration, attendees will explore Atlas's dynamic topology visualization and AI-powered chat experience, enabling users to quickly understand dependencies, answer environment questions, and gain actionable insights. Learn how organizations are leveraging Atlas for change management, audit readiness, application refactoring, business service mapping, and drift detection, while also helping shape the future of the platform through direct feedback.","speakers":"Meghan McGrath","room":"Ballroom Foyer","roomSetup":null,"projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","showInDashboard":true,"av":{"presentationRequired":true,"presentationSource":"Design Fair Station","clicker":false,"confidenceMonitors":0,"timerMins":0,"wirelessHandheldMics":0,"lavalierHeadsetMics":0,"catchBoxMics":0,"audioPlayback":false,"xlrAudioFeed":false,"projector":true,"videoPlayback":false,"podium":false,"panelChairs":0,"sideTables":0,"highTopTables":0,"easel":false,"flipChart":false,"roomSetup":null,"stageSetup":null,"specialRequirements":["Will need large sticky pad for easel"]},"files":[],"avNote":null,"operatorNote":null,"stageSetup":null},{"id":"monday-16-15-ballroom-foyer-would-you-trust-an-ai-agent","day":"Monday","date":null,"startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Would You Trust an AI Agent With This?","description":"Experience Agentic AI in action within IBM Concert for Z and see how AI can accelerate problem determination by analyzing system signals, identifying likely causes, gathering evidence, and recommending next steps. After the live demonstration, participate in a quick interactive voting exercise where you'll decide whether specific operational tasks should be automated by AI, assisted by AI, or remain under human control. This engaging session explores the evolving relationship between human expertise and AI-driven operations, highlighting how Agentic AI can help address knowledge gaps,reduce reliance on specialized experts, and improve decision-making across complex environments. Attendees will gain insight into the practical applications of autonomous operations while helping shape the future direction of Concert for Z's Agentic AI capabilities.","speakers":"Jenee Hart","room":"Ballroom Foyer","roomSetup":null,"projection":"Design Fai // ── Download-tracking ─────────────────────────────────────
// Maps file status → display state: "nofile" | "onhold" | "nolink" | "update" | "downloaded" | "uploaded"
function dlState(f) {
  if (f.status === "nofile")     return "nofile";
  if (f.status === "onhold")     return "onhold";
  if (!f.boxFileId)              return "nolink";
  if (f.status === "updated")    return "update";
  if (f.status === "downloaded") return "downloaded";
  return "uploaded";
}

// Writes downloaded status + timestamp back to GitHub so all browsers see it
async function pushDownloadStatus(sessionId, boxFileId) {
  if (!avData) return;
  const session = avData.sessions.find(s => s.id === sessionId);
  if (!session) return;
  const file = (session.files || []).find(f => f.boxFileId === boxFileId);
  if (!file) return;

  file.status      = "downloaded";
  file.downloadedAt = new Date().toISOString();

  try {
    const headRes = await fetch(API_URL, {
      headers: { Authorization: `Bearer ${VENDOR_TOKEN}`, Accept: "application/vnd.github+json" }
    });
    if (!headRes.ok) return;
    const sha = (await headRes.json()).sha;

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(avData, null, 2))));
    await fetch(API_URL, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${VENDOR_TOKEN}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Downloaded: ${session.title} — ${file.fileName || file.fileType}`,
        content,
        sha
      })
    });
  } catch(_) {
    // Silent fail — download already happened, status update is best-effort
  }
}


// ── Legacy → structured av migration (mirrors admin.html) ─────────────────
// Runs once per session at load time. Non-destructive: only sets av.* fields that
// are not already populated. Once a session is saved through the admin UI, all
// canonical fields live in s.av and the legacy root fields are no longer used.
function migrateSession(s) {
  if (!s.av) s.av = {};
  const av = s.av;

  // Only migrate projection if it's a known valid value, not free-text operator notes
  const VALID_PROJECTION = ["av team", "av team - led", "presenter", "presenter laptop", "led wall", "design fair station", "not required"];
  if (s.projection && !av.presentationSource && VALID_PROJECTION.some(v => s.projection.toLowerCase().startsWith(v)))
    av.presentationSource = s.projection;

  if (s.timer != null && s.timer !== false && s.timer !== "" && av.timer == null)
    av.timer = true;

  if (s.monitor && av.confidenceMonitors == null) {
    const n = parseInt(s.monitor);
    av.confidenceMonitors = isNaN(n) ? 0 : n;
  }

  if (s.roomSetup && !av.roomSetup)
    av.roomSetup = s.roomSetup;

  const hasMicCounts = av.wirelessHandheldMics || av.lavalierHeadsetMics ||
                       av.wirelessLavalierMics || av.headsetMics ||
                       av.tableMics || av.catchBoxMics || av.panelMics;
  if (s.microphones && !hasMicCounts) {
    const t = s.microphones.toLowerCase();
    const pick = (patterns) => {
      for (const p of patterns) { const m = t.match(p); if (m) return parseInt(m[1]) || 0; }
      return 0;
    };
    av.wirelessHandheldMics = pick([/(\d+)\s*(?:wireless\s*)?hand\s*held/, /hand\s*held[^0-9]*(\d+)/, /(\d+)\s*wireless(?!\s*lav)/]);
    av.wirelessLavalierMics = pick([/(\d+)\s*lav/, /lav[^0-9]*(\d+)/]);
    av.catchBoxMics         = pick([/(\d+)\s*catch\s*box/, /catch\s*box[^0-9]*(\d+)/]);
    av.panelMics            = pick([/(\d+)\s*panel/, /panel[^0-9]*(\d+)/]);
    av.headsetMics          = pick([/(\d+)\s*headset/]);
    av.tableMics            = pick([/(\d+)\s*table/]);
    // Combined lavalier+headset for the new UI field (used by lhVal fallback)
    av.lavalierHeadsetMics  = (av.wirelessLavalierMics||0) + (av.headsetMics||0) || undefined;
    // Only store as a visible note if it's not a "no mic" indicator
    const noMicPattern = /^\s*(no\s*mic|none|n\/a|not\s*required|-+)\s*$/i;
    av.legacyMicsNote = noMicPattern.test(s.microphones) ? null : s.microphones;
  }
}

function migrateAll() {
  if (!avData || !avData.sessions) return;
  for (const s of avData.sessions) migrateSession(s);
}

// ── Boot ──────────────────────────────────────────────────
let avData = null;
let activeRoom = null;   // null = All Rooms

async function loadData() {
  // Tier 1: GitHub Contents API — always current, no CDN lag
  try {
    const res = await fetch(API_URL, {
      headers: { Authorization: `Bearer ${VENDOR_TOKEN}`, Accept: "application/vnd.github+json" },
      cache: "no-store"
    });
    if (res.ok) {
      const json = await res.json();
      if (json.content) {
        const d = JSON.parse(atob(json.content.replace(/\n/g, "")));
        if (d && d.sessions) {
          avData = d;
          migrateAll();
          document.getElementById("last-refresh").textContent = "Updated " + fmtTs(avData.lastUpdated);
          return true;
        }
      }
    }
  } catch(_) {}

  // Tier 2: raw.githubusercontent.com (no auth needed, but up to ~5 min CDN lag)
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const d = await res.json();
      if (d && d.sessions) {
        avData = d;
        migrateAll();
        document.getElementById("last-refresh").textContent = "Updated " + fmtTs(avData.lastUpdated);
        return true;
      }
    }
  } catch(_) {}

  // Tier 3: Inline embedded data (always works, including file://)
  try {
    if (typeof EMBEDDED_DATA !== "undefined" && EMBEDDED_DATA.sessions) {
      avData = EMBEDDED_DATA;
      migrateAll();
      document.getElementById("last-refresh").textContent = "Embedded data";
      return true;
    }
  } catch(_) {}

  document.getElementById("loading").innerHTML = `<strong style="color:#dc2626">Error loading data.</strong><br>Check network connection and try refreshing.`;
  return false;
}

window.addEventListener("DOMContentLoaded", async () => {
  const ok = await loadData();
  if (!ok) return;
  try {
    renderAll();
  } catch(e) {
    document.getElementById("loading").innerHTML =
      `<strong style="color:#dc2626">Render error: ${e.message}</strong><br><pre style="font-size:11px;text-align:left;margin-top:8px">${e.stack}</pre>`;
    return;
  }
  document.getElementById("loading").style.display  = "none";
  document.getElementById("app").style.display      = "block";
  document.getElementById("summary-bar").style.display = "grid";
  document.getElementById("left-nav").style.display  = "flex";
  document.getElementById("left-nav").style.flexDirection = "column";
  setInterval(refresh, REFRESH_MS);
});

async function refresh() {
  const prev = avData ? JSON.stringify(avData.lastUpdated) : null;
  const ok = await loadData();
  if (!ok) return;
  if (JSON.stringify(avData.lastUpdated) !== prev) {
    try { renderAll(); } catch(_) {}
  }
}

async function manualRefresh() {
  const btn = document.getElementById("refreshBtn");
  if (btn) { btn.disabled = true; btn.textContent = "↺ Refreshing…"; }
  const prev = avData ? JSON.stringify(avData.lastUpdated) : null;
  const ok = await loadData();
  if (ok) {
    try { renderAll(); } catch(_) {}
  }
  document.getElementById("last-refresh").textContent =
    ok ? "Updated " + fmtTs(avData?.lastUpdated) : "Refresh failed";
  if (btn) { btn.disabled = false; btn.textContent = "↺ Refresh Now"; }
}

function printRoomRundown(mode) {
  if (!avData) return;
  mode = mode || "room";

  // Normalize smart punctuation to ASCII equivalents for reliable print rendering
  function pesc(str) {
    return esc(String(str ?? "")
      .replace(/[\u2013\u2014]/g, "-")   // en-dash, em-dash → hyphen
      .replace(/[\u2018\u2019]/g, "'")   // smart single quotes → apostrophe
      .replace(/[\u201C\u201D]/g, '"')   // smart double quotes → straight quote
    );
  }

  const sessions = vendorSessions();
  const DAY_ORDER_P = ["Sunday","Monday","Tuesday","Wednesday","Thursday"];

  // Remove any old print wrapper
  document.querySelectorAll(".print-rundown-root").forEach(el => el.remove());

  const eventDate = avData.eventDates || "";
  const eventLoc  = avData.location || "";
  const modeLabel = mode === "day" ? "Daily Rundown" : "Room Rundown";
  const printDate = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

  // ── Shared: build a single session row ───────────────────
  function buildSessionRow(s) {
    const av = s.av || {};
    const timeStr = s.startTime + (s.endTime ? `-${s.endTime}` : "");
    const avChips = [];
    if (av.presentationSource) avChips.push(av.presentationSource);
    if (av.clicker) avChips.push("Clicker");
    if (av.confidenceMonitors) avChips.push(av.confidenceMonitors + " Confidence Monitor" + (av.confidenceMonitors > 1 ? "s" : ""));
    if (av.timerMins) avChips.push(av.timerMins + " min Timer");
    if (av.wirelessHandheldMics) avChips.push(av.wirelessHandheldMics + " Wireless Handheld Mic" + (av.wirelessHandheldMics > 1 ? "s" : ""));
    if (av.lavalierHeadsetMics) avChips.push(av.lavalierHeadsetMics + " Lavalier / Headset Mic" + (av.lavalierHeadsetMics > 1 ? "s" : ""));
    if (av.catchBoxMics) avChips.push(av.catchBoxMics + " CatchBox" + (av.catchBoxMics > 1 ? "es" : ""));
    if (av.audioPlayback) avChips.push("Audio Playback");
    if (av.videoPlayback) avChips.push("Video Playback");
    if (av.projector) avChips.push("Projector");
    if (av.xlrAudioFeed) avChips.push("XLR Audio Feed");
    const files = s.files || [];
    let filesHTML = "";
    const noFileNeeded = !av.presentationRequired
      || av.presentationSource === "Design Fair Station"
      || av.presentationSource === "Collaborative"
      || av.presentationSource === "Presenter Laptop";
    if (!files.length) {
      filesHTML = noFileNeeded
        ? `<div class="prd-file-row prd-file-wait" style="color:#9ca3af">Not required</div>`
        : `<div class="prd-file-row prd-file-wait">Awaiting file</div>`;
    } else {
      filesHTML = files.map(f => {
        const name = pesc(f.fileName || f.fileType || "file");
        if (f.status === "nofile") return `<div class="prd-file-row prd-file-wait">No file needed</div>`;
        if (f.status === "onhold") return `<div class="prd-file-row prd-file-wait">${name} (On Hold)</div>`;
        const dlLine = f.downloadedAt ? `<span class="prd-file-dl"> (dl ${fmtTs(f.downloadedAt)})</span>` : "";
        const updClass = f.status === "updated" ? " prd-file-upd" : "";
        return `<div class="prd-file-row${updClass}">${name}${dlLine}</div>`;
      }).join("");
    }
    const noteText = (s.avNote || (av && av.avNote) || "").trim();
    const noteHTML = noteText ? `<div class="prd-note">Note: ${pesc(noteText)}</div>` : "";
    const speakers = s.speakers ? `<div class="prd-speakers">${pesc(s.speakers.slice(0,80))}</div>` : "";
    const avHTML = (avChips.length
      ? avChips.map(c => `<span class="prd-av-item">${pesc(c)}</span>`).join("")
      : `<span class="prd-av-item" style="color:#9ca3af">-</span>`) + noteHTML;
    return `<tr>
      <td class="prd-time">${pesc(timeStr)}</td>
      <td class="prd-col-session"><div class="prd-title">${pesc(s.title)}</div>${speakers}</td>
      <td class="prd-av">${avHTML}</td>
      <td class="prd-files">${filesHTML}</td>
    </tr>`;
  }

  function buildTable(sectionSessions) {
    return `<table class="prd-table"><thead><tr>
      <th style="width:90px">Time</th><th class="prd-col-session">Session</th><th>AV</th><th>Files</th>
    </tr></thead><tbody>${sectionSessions.map(buildSessionRow).join("")}</tbody></table>`;
  }

  const lines = [];
  lines.push(`<div class="print-rundown-root">`);
  lines.push(`<div class="prd-cover">
    <div class="prd-cover-title">${pesc(avData.event || "AV")} - ${modeLabel}</div>
    <div class="prd-cover-sub">${pesc(eventDate)}${eventLoc ? " | " + pesc(eventLoc) : ""} | Printed ${printDate}</div>
  </div>`);

  if (mode === "day") {
    // ── By Day: section per day, sub-grouped by room ─────
    const dayMap = {};
    for (const s of sessions) {
      if (!dayMap[s.day]) dayMap[s.day] = {};
      const room = s.room || "Unassigned";
      if (!dayMap[s.day][room]) dayMap[s.day][room] = [];
      dayMap[s.day][room].push(s);
    }
    for (const day of DAY_ORDER_P.filter(d => dayMap[d])) {
      const daySessions = sessions.filter(s => s.day === day);
      const date = daySessions[0]?.date ? fmtDateShort(daySessions[0].date) : "";
      lines.push(`<div class="prd-room">`);
      lines.push(`<div class="prd-room-hdr">${pesc(day)}${date ? " - " + date : ""}</div>`);
      for (const room of Object.keys(dayMap[day]).sort()) {
        lines.push(`<div class="prd-day-hdr">${pesc(room)}</div>`);
        lines.push(buildTable(dayMap[day][room]));
      }
      lines.push(`</div>`);
    }
  } else {
    // ── By Room: section per room, sub-grouped by day ────
    const roomMap = {};
    for (const s of sessions) {
      const room = s.room || "Unassigned";
      if (!roomMap[room]) roomMap[room] = {};
      if (!roomMap[room][s.day]) roomMap[room][s.day] = [];
      roomMap[room][s.day].push(s);
    }
    for (const room of Object.keys(roomMap).sort()) {
      lines.push(`<div class="prd-room">`);
      lines.push(`<div class="prd-room-hdr">${pesc(room)}</div>`);
      for (const day of DAY_ORDER_P.filter(d => roomMap[room][d])) {
        const daySessions = roomMap[room][day];
        const date = daySessions[0]?.date ? fmtDateShort(daySessions[0].date) : "";
        lines.push(`<div class="prd-day-hdr">${pesc(day)}${date ? " - " + date : ""}</div>`);
        lines.push(buildTable(daySessions));
      }
      lines.push(`</div>`);
    }
  }

  lines.push(`</div>`); // print-rundown-root

  // Inject and print
  const wrapper = document.createElement("div");
  wrapper.innerHTML = lines.join("");
  const root = wrapper.firstElementChild;
  document.body.appendChild(root);
  // Use afterprint to clean up the injected DOM
  function cleanup() { root.remove(); window.removeEventListener("afterprint", cleanup); }
  window.addEventListener("afterprint", cleanup);
  window.print();
}

// ── Render ─────────────────────────────────────────────────
function renderAll() {
  renderSummary();
  renderDays();
  renderChangelog();
  renderNeedsAttention();
}

// Sessions visible to the vendor team — only those explicitly flagged in admin
function vendorSessions() {
  return (avData.sessions || []).filter(s => s.showInDashboard === true);
}

function isAvTeamSource(s) {
  const src = (s.av && s.av.presentationSource || "").toLowerCase();
  return src.startsWith("av team") || src.startsWith("av ");
}

function renderSummary() {
  const sessions = vendorSessions();
  let files=0, uploaded=0, updated=0, noFile=0;
  for (const s of sessions) {
    if (!isAvTeamSource(s)) continue;
    const sf = s.files || [];
    files    += sf.filter(f=>f.status!=="nofile").length;
    uploaded += sf.filter(f=>f.status==="uploaded"||f.status==="downloaded").length;
    updated  += sf.filter(f=>f.status==="updated").length;
    if (sf.length === 0 || sf.every(f=>f.status==="onhold"||f.status==="nofile")) noFile++;
  }
  document.getElementById("s-sessions").textContent = sessions.length;
  document.getElementById("s-files").textContent    = files;
  document.getElementById("s-approved").textContent = uploaded;
  document.getElementById("s-updated").textContent  = updated;
  document.getElementById("s-nofile").textContent   = noFile;
}

function renderNeedsAttention() {
  const bar = document.getElementById("needs-attention");
  const updated = vendorSessions().filter(s => s.files && s.files.some(f => f.status === "updated"));
  if (updated.length > 0) {
    bar.style.display = "block";
    bar.textContent   = `⚠ ${updated.length} session${updated.length>1?"s have":" has"} updated files — re-download required: ` +
      updated.map(s => s.title.slice(0,40)).join("; ");
  } else {
    bar.style.display = "none";
  }
}

function renderDays() {
  const allVendor = vendorSessions();
  const days = DAY_ORDER.filter(d => allVendor.some(s => s.day === d));
  const navDaysEl  = document.getElementById("nav-days");
  const navRoomsEl = document.getElementById("nav-rooms");
  const panelsEl   = document.getElementById("day-panels");

  if (!days.length) {
    navDaysEl.innerHTML  = `<span class="left-nav-label">Event Days</span>`;
    navRoomsEl.innerHTML = `<span class="left-nav-label">Rooms</span>`;
    panelsEl.innerHTML   = `<p style="color:var(--muted);font-size:13px;padding:24px 0;text-align:center">No sessions have been marked for the dashboard yet.<br><span style="font-size:11.5px">Use the Dashboard checkbox in the AV Admin to include sessions.</span></p>`;
    return;
  }

  // Build room list from current data
  const rooms = [...new Set(allVendor.map(s => s.room).filter(Boolean))].sort();

  // Validate activeRoom still exists
  if (activeRoom && !rooms.includes(activeRoom)) activeRoom = null;

  // Preserve active day across refreshes
  const prevActiveDay = navDaysEl.querySelector(".day-link.active")?.dataset?.day || days[0];

  // ── Day nav ──────────────────────────────────────────────
  navDaysEl.innerHTML = `<span class="left-nav-label">Event Days</span>`;
  days.forEach(day => {
    const sessions = allVendor.filter(s => s.day === day);
    const date     = sessions[0]?.date ? fmtDateShort(sessions[0].date) : "";
    const a = document.createElement("a");
    a.href = "#";
    a.className = "day-link" + (day === prevActiveDay ? " active" : "");
    a.dataset.day = day;
    a.innerHTML = `${day}<span class="day-link-sub">${date} · ${sessions.length} sessions</span>`;
    a.addEventListener("click", e => { e.preventDefault(); switchDay(day); });
    navDaysEl.appendChild(a);
  });

  // ── Room nav ─────────────────────────────────────────────
  navRoomsEl.innerHTML = `<span class="left-nav-label">Rooms</span>`;
  // "All Rooms" button
  const allBtn = document.createElement("button");
  allBtn.className = "room-nav-btn" + (!activeRoom ? " active" : "");
  allBtn.innerHTML = `All Rooms <span class="room-nav-count">${allVendor.length}</span>`;
  allBtn.addEventListener("click", () => setRoomFilter(null));
  navRoomsEl.appendChild(allBtn);
  // Per-room buttons
  rooms.forEach(r => {
    const cnt = allVendor.filter(s => s.room === r).length;
    const btn = document.createElement("button");
    btn.className = "room-nav-btn" + (activeRoom === r ? " active" : "");
    btn._roomName = r;
    btn.innerHTML = `${esc(r)} <span class="room-nav-count">${cnt}</span>`;
    btn.addEventListener("click", () => setRoomFilter(r));
    navRoomsEl.appendChild(btn);
  });

  // ── Day panels ───────────────────────────────────────────
  panelsEl.innerHTML = `<div class="legend-bar">
    <span class="legend-title">Download Status:</span>
    <span class="legend-item"><span class="fs-pill fs-update" style="width:20px;height:20px;font-size:12px">↻</span> Re-download required</span>
    <span class="legend-item"><span class="fs-pill fs-new"    style="width:20px;height:20px;font-size:12px">⬇</span> Download needed</span>
    <span class="legend-item"><span class="fs-pill fs-done"   style="width:20px;height:20px;font-size:12px">✓</span> Downloaded / Distributed</span>
    <span class="legend-item"><span class="fs-pill fs-hold"   style="width:20px;height:20px;font-size:12px">⏸</span> On Hold — awaiting upload</span>
    <span class="legend-item"><span class="fs-pill fs-nofile" style="width:20px;height:20px;font-size:12px">—</span> Awaiting File</span>
    <span style="margin-left:4px;font-style:italic">· Hover a pill to see file name · Click AV Details to open/close full details</span>
  </div>`;

  days.forEach(day => {
    const sessions = allVendor.filter(s => s.day === day);
    const date     = sessions[0]?.date ? fmtDateShort(sessions[0].date) : "";

    const panel = document.createElement("div");
    panel.className = "day-panel" + (day === prevActiveDay ? " active" : "");
    panel.id = "panel-" + day;

    const hdr = document.createElement("div");
    hdr.className = "day-panel-header";
    hdr.innerHTML = `${day}<span class="day-panel-date">${date}</span>`;
    panel.appendChild(hdr);

    sessions.forEach(s => panel.appendChild(buildSessionBlock(s)));
    panelsEl.appendChild(panel);
  });

  // Apply current room filter after building
  applyRoomFilter();
}

function setRoomFilter(room) {
  activeRoom = room;
  document.querySelectorAll(".room-nav-btn").forEach(b => {
    const isAll = !b._roomName;
    b.classList.toggle("active", room === null ? isAll : b._roomName === room);
  });
  applyRoomFilter();
}

function applyRoomFilter() {
  document.querySelectorAll(".session-block[data-room]").forEach(block => {
    const match = !activeRoom || block.dataset.room === activeRoom;
    block.classList.toggle("room-hidden", !match);
  });
}

// Returns a border-class based on the dominant file status of a session
function sessionBlockClass(s) {
  const files = s.files || [];
  if (!files.length) return "sb-nofiles";
  const statuses = files.map(f => f.status);
  if (statuses.includes("onhold"))   return "sb-onhold";
  if (statuses.includes("updated"))  return "sb-updated";
  if (statuses.every(st => st === "uploaded" || st === "downloaded" || st === "nofile")) return "sb-approved";
  if (statuses.includes("nofile"))                                                              return "sb-nofile";
  return "";
}

function buildSessionBlock(s) {
  const block = document.createElement("div");
  block.id = "sblock-" + s.id;
  const sbCls = sessionBlockClass(s);
  block.className = "session-block" + (sbCls ? " " + sbCls : "");
  if (s.room) block.dataset.room = s.room;
  const [badgeClass, badgeLabel] = TYPE_BADGE[s.sessionType] || ["badge-default", s.sessionType];
  const files = s.files || [];
  const endPart = s.endTime ? `<span style="font-weight:400;color:var(--subtle)"> – ${esc(s.endTime)}</span>` : "";

  const avNoteValue = s.avNote || (s.av && s.av.avNote) || s.operatorNote || "";
  let noteHTML = "";
  if (avNoteValue && avNoteValue.trim()) {
    noteHTML = '<div class="av-groups" style="margin-top:0">' +
      '<div class="av-note-card">' +
        '<div class="av-group-hdr"><span class="g-icon">📝</span> AV Note <span style="font-size:9px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--subtle);margin-left:4px">(visible to vendor team)</span></div>' +
        '<div class="av-note-body">' + esc(avNoteValue.trim()) + '</div>' +
      '</div>' +
    '</div>';
  }

  block.innerHTML = `
    <div class="session-row">
      <div class="session-time">
        <span class="t-start">${esc(s.startTime || "—")}</span>${endPart}
      </div>
      <div class="session-info">
        <div class="session-title">${esc(s.title)}</div>
        <div class="session-sub">${s.speakers ? esc(s.speakers.slice(0,80)) : "&nbsp;"}</div>
        <div style="margin-top:6px;display:flex;align-items:center;gap:8px">
          <button class="av-details-btn" onclick="toggleSession('${s.id}')">
            AV Details <span class="chevron">&#x25B8;</span>
          </button>
          ${(s.avNote || (s.av && s.av.avNote) || s.operatorNote) ? '<span style="font-size:11px;color:#d97706;font-weight:600;display:inline-flex;align-items:center;gap:3px">📝 Note</span>' : ''}
        </div>
      </div>
      <div class="session-type-col" style="flex-direction:column;align-items:flex-start">
        <span class="session-room-label">Room</span>
        <span class="session-room-val">${esc(s.room || "—")}</span>
      </div>
      <div class="session-type-col" style="flex-direction:column;align-items:flex-start">
        <span class="session-room-label">Files</span>
        <div id="row-pills-${s.id}" style="display:flex;align-items:center;gap:6px;justify-content:flex-start">
          ${buildRowFilePills(s)}
        </div>
      </div>
    </div>
    <div class="session-expanded">
      <div class="av-groups">
        <div class="av-group">
          <div class="av-group-hdr" style="justify-content:space-between">
            <span><span class="g-icon">📁</span> Files</span>
          </div>
          <div class="av-group-body av-special" style="padding:10px" id="files-body-${s.id}">
            ${buildFilesSection(s)}
          </div>
        </div>
      </div>
      ${buildAVChips(s)}
      ${noteHTML}
    </div>`;
  return block;
}

function buildAVChips(s) {
  const id = s.id;
  // Migration is guaranteed by migrateAll() at load time.
  if (!s.av) migrateSession(s);

  const av = s.av;
  const presSource = av.presentationSource || "";
  const presRequired = av.presentationRequired != null ? av.presentationRequired : !!presSource;

  // Helpers matching admin.html exactly
  const avNum  = (field, def=0)     => (av && av[field] != null) ? av[field] : def;
  const avBool = (field, def=false) => (av && av[field] != null) ? av[field] : def;
  const avStr  = (field, def="")    => (av && av[field] != null) ? av[field] : def;

  // Decode a picker-serialised value ("presetKey|opt1,opt2,capacity:N|notes") into readable HTML
  function decodePickerValue(raw, presets) {
    if(!raw) return null;
    const parts = raw.split("|");
    const presetKey = parts[0];
    const optKeys   = parts[1] ? parts[1].split(",").filter(Boolean) : [];
    const notes     = parts[2] || "";
    const preset    = presets ? presets.find(p => p.key === presetKey) : null;
    const lines = [];
    if(preset) {
      lines.push(preset.label);
      const optLabels = [];
      for(const o of preset.options) {
        if(o.isCapacity) {
          const capMatch = optKeys.find(k => k.startsWith("capacity:"));
          if(capMatch) optLabels.push("Capacity: " + capMatch.replace("capacity:", ""));
        } else if(optKeys.includes(o.id)) {
          optLabels.push(o.label);
        }
      }
      if(optLabels.length > 0) {
        lines[0] += " (" + optLabels.join(", ") + ")";
      }
    } else if(presetKey) {
      // Unknown preset — show raw
      lines.push(presetKey);
    }
    if(notes) lines.push(notes);
    return lines.length ? lines.join("\n") : null;
  }

  // ── Speakers group ────────────────────────────────────────────────────────
  const names = s.speakers ? s.speakers.split(",").map(n => n.trim()).filter(Boolean) : [];
  const speakerRows = names.length > 0
    ? names.map(name => `<div class="av-req"><span class="v">${esc(name)}</span></div>`).join("")
    : `<div class="av-req"><span class="v-muted">—</span></div>`;

  let html = `<div class="av-groups">
    <div class="av-group">
      <div class="av-group-hdr"><span><span class="g-icon">👤</span> Speakers</span></div>
      <div class="av-group-body av-special">
        ${speakerRows}
      </div>
    </div>`;

  // ── AV groups from config ─────────────────────────────────────────────────
  for (const grp of AV_GROUPS) {
    const fields = AV_CONFIG.filter(f => f.group === grp.key);
    let fieldsHTML = "";
    for (const f of fields) {
      if (f.type === "bool") {
        const val = f.id === "presentationRequired" ? presRequired : avBool(f.id);
        const badge = val ? '<span class="v-yes">✓ Yes</span>' : '<span class="v-muted">—</span>';
        fieldsHTML += `<div class="av-req"><span class="k">${f.label}</span><span class="v">${badge}</span></div>`;
      } else if (f.type === "num") {
        const val = f.id === "lavalierHeadsetMics"
          ? avNum("lavalierHeadsetMics", (avNum("wirelessLavalierMics") || 0) + (avNum("headsetMics") || 0))
          : avNum(f.id);
        fieldsHTML += `<div class="av-req"><span class="k">${f.label}</span><span class="v">${val}</span></div>`;
      } else if (f.type === "select") {
        const cur = avStr(f.id, "");
        const opt = f.options.find(o => o.value === cur);
        const displayVal = opt ? opt.label : (cur || "—");
        fieldsHTML += `<div class="av-req"><span class="k">${f.label}</span><span class="v">${esc(displayVal)}</span></div>`;
      } else if (f.type === "text") {
        const val = avStr(f.id, "");
        const displayVal = val || "—";
        const cls = f.full ? " av-req-full" : "";
        fieldsHTML += `<div class="av-req${cls}"><span class="k">${f.label}</span><span class="v">${esc(displayVal)}</span></div>`;
      }
    }
    html += `
    <div class="av-group">
      <div class="av-group-hdr"><span class="g-icon">${grp.icon}</span> ${grp.label}</div>
      <div class="av-group-body">${fieldsHTML}</div>
    </div>`;
  }

  html += "</div>";
  return html;
}

// Clickable download pills shown on the collapsed session row
function buildRowFilePills(s) {
  const files = s.files || [];
  if (!files.length) return `<span class="fs-pill fs-nofile" title="Awaiting File">—</span>`;

  return files.map(f => {
    const tip   = f.fileName || f.fileType || "file";
    const state = dlState(f);

    if (state === "nofile")  return "";  // no indicator for no-file-needed
    if (state === "onhold")  return `<span class="fs-pill fs-hold" title="On Hold: ${tip}">⏸</span>`;
    if (state === "nolink")  return `<span class="fs-pill fs-nofile" title="Awaiting File: ${tip}">—</span>`;
    const cls  = state === "update" ? "fs-update" : state === "downloaded" ? "fs-done" : "fs-new";
    const icon = state === "update" ? "↻" : state === "downloaded" ? "✓" : "⬇";
    return `<span class="fs-pill ${cls}" title="${tip}">${icon}</span>`;
  }).filter(Boolean).join("") || `<span class="fs-pill fs-nofile">—</span>`;
}

function buildFilesSummary(files) {
  if (!files.length) return '<span style="font-size:10.5px;color:var(--amber)">Awaiting File</span>';
  const u = files.filter(f=>f.status==="updated").length;
  const a = files.filter(f=>f.status==="uploaded"||f.status==="downloaded").length;
  const h = files.filter(f=>f.status==="onhold").length;
  const parts = [];
  if (u) parts.push(`<span style="color:var(--amber);font-size:10.5px;font-weight:700">↻ update</span>`);
  if (a) parts.push(`<span style="color:var(--green);font-size:10.5px;font-weight:700">${a}✓</span>`);
  if (h) parts.push(`<span style="color:var(--amber);font-size:10.5px;font-weight:700">${h}⏸</span>`);
  return parts.join(" ");
}

function buildFilesSection(s) {
  const files = s.files || [];
  if (!files.length) {
    const noPresReq = s.av && s.av.presentationRequired === false;
    return noPresReq
      ? `<p class="no-files-msg">No file required — presentation not required for this session or projected from presenter&#39;s laptop.</p>`
      : `<p class="no-files-msg">Awaiting File — no files uploaded yet.</p>`;
  }

  const rows = files.map((f, i) => {
    const state = dlState(f);

    // nofile rows — no button, no timestamps
    if (state === "nofile") return `<tr>
      <td>${esc(f.fileType||"")}</td>
      <td colspan="3" style="font-size:11.5px;color:var(--muted);font-style:italic">No file needed</td>
      <td></td>
    </tr>`;

    // onhold — no download button
    if (state === "onhold") return `<tr>
      <td>${esc(f.fileType||"")}</td>
      <td>${esc(f.fileName||"—")}</td>
      <td colspan="2" style="font-size:11.5px;color:var(--muted)">⏸ Awaiting upload</td>
      <td></td>
    </tr>`;

    const updFmt = f.updatedAt    ? fmtTs(f.updatedAt)    : "—";
    const dlFmt  = f.downloadedAt ? fmtTs(f.downloadedAt) : null;

    const btnId = `dlbtn-${s.id}-${i}`;
    let dlBtn;
    if (state === "nolink") {
      dlBtn = `<span class="dl-nolink">No link yet</span>`;
    } else {
      const href  = `https://ibm.box.com/s/${esc(f.boxFileId)}`;
      const cls   = state === "update"     ? "dl-btn dl-update"
                  : state === "downloaded" ? "dl-btn dl-done"
                                           : "dl-btn dl-new";
      const label = state === "update"     ? "↻ Re-download"
                  : state === "downloaded" ? "↓ Re-download"
                                           : "⬇ Download";
      dlBtn = `<a id="${btnId}" class="${cls}" href="${href}" target="_blank" rel="noopener"
                 onclick="onDownload('${esc(f.boxFileId)}','${btnId}')">${label}</a>`;
    }

    return `<tr>
      <td>${esc(f.fileType||"")}</td>
      <td>${esc(f.fileName||"(unnamed)")}</td>
      <td style="font-size:11.5px;color:var(--muted)">${updFmt}</td>
      <td style="font-size:11.5px;color:${dlFmt ? "var(--green)" : "var(--muted)"}">${dlFmt ? "✓ " + dlFmt : "—"}</td>
      <td>${dlBtn}</td>
    </tr>`;
  }).join("");

  return `<table class="files-table">
    <thead><tr>
      <th style="width:120px">Type</th>
      <th>Name</th>
      <th style="width:110px">Updated</th>
      <th style="width:110px">Downloaded</th>
      <th style="width:130px"></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderChangelog() {
  const list = document.getElementById("changelog-list");
  const log  = (avData.changelog || []).slice(0, 50);
  if (!log.length) {
    list.innerHTML = `<li class="cl-empty">No changes recorded yet.</li>`;
    return;
  }
  list.innerHTML = log.map(e => {
    const from = e.from || e.oldStatus || "";
    const to   = e.to   || e.newStatus || "";
    const toClass = {
      "approved":"cl-pill-to-approved","updated":"cl-pill-to-updated","onhold":"cl-pill-to-onhold"
    }[to] || "";
    const fmtStatus = s => ({"approved":"Approved","updated":"Updated","onhold":"On Hold","pending":"Awaiting File","nofile":"No File Needed","removed":"Removed"}[s] || s);
    return `<li class="changelog-item">
      <div class="cl-ts">${fmtTs(e.ts)}</div>
      <div class="cl-session">${esc(e.day)} · ${esc(e.sessionTitle||"").slice(0,50)}</div>
      <div class="cl-detail">${esc(e.fileType||"")} &nbsp;
        <span class="cl-pill cl-pill-from">${esc(fmtStatus(from))}</span>
        → <span class="cl-pill ${toClass}">${esc(fmtStatus(to))}</span>
      </div>
    </li>`;
  }).join("");
}

// ── Interaction ────────────────────────────────────────────
function toggleSession(sid) {
  const block = document.getElementById("sblock-" + sid);
  if (block) {
    block.classList.toggle("open");
  }
}

// Called from onclick — records download timestamp and writes to GitHub
function onDownload(boxFileId, btnId) {
  if (!avData) return;
  for (const s of avData.sessions) {
    if ((s.files || []).some(f => f.boxFileId === boxFileId)) {
      // Update local in-memory data immediately
      s.files.forEach(f => {
        if (f.boxFileId === boxFileId) {
          f.status       = "downloaded";
          f.downloadedAt = new Date().toISOString();
        }
      });
      // Re-render row pills (compact view)
      const rowPills = document.getElementById("row-pills-" + s.id);
      if (rowPills) rowPills.innerHTML = buildRowFilePills(s);
      // Re-render expanded file table
      const filesBody = document.getElementById("files-body-" + s.id);
      if (filesBody) filesBody.innerHTML = buildFilesSection(s);
      // Re-render stats bar and attention banner
      renderSummary();
      renderNeedsAttention();
      // Push to GitHub — best-effort, silent fail
      pushDownloadStatus(s.id, boxFileId);
      break;
    }
  }
}

function switchDay(day) {
  document.querySelectorAll(".day-link").forEach(a => {
    a.classList.toggle("active", a.dataset.day === day);
  });
  document.querySelectorAll(".day-panel").forEach(p => {
    p.classList.toggle("active", p.id === "panel-" + day);
  });
}

// ── Helpers ────────────────────────────────────────────────
function esc(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTs(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
}
function fmtDateShort(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
}
