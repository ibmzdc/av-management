<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV Dashboard — ZDC 2026 Fall</title>
<style>
/* ── Reset & Base ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --surface: #f7f8fa;
  --border: #e5e7eb;
  --text: #1f2328;
  --muted: #57606a;
  --accent: #3b82d4;
  --green: #16a34a; --green-bg: #dcfce7; --green-border: #86efac;
  --blue:  #2563eb; --blue-bg:  #dbeafe; --blue-border:  #93c5fd;
  --amber: #d97706; --amber-bg: #fef3c7; --amber-border: #fcd34d;
  --gray:  #374151; --gray-bg:  #f3f4f6; --gray-border:  #d1d5db;
  --red:   #dc2626; --red-bg:   #fee2e2; --red-border:   #fca5a5;
  --radius: 6px;
}
body { font-family: -apple-system,"Segoe UI",system-ui,sans-serif; font-size: 13px; line-height: 1.5; color: var(--text); background: var(--bg); }

/* ── Header ─────────────────────────────────────────────── */
header { background: var(--text); color: #fff; padding: 0 20px; display: flex; align-items: center; gap: 16px; height: 50px; }
header h1 { font-size: 15px; font-weight: 700; flex: 1; }
.refresh-meta { font-size: 11.5px; color: #9ca3af; text-align: right; line-height: 1.4; }
.refresh-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 5px; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Summary Bar ─────────────────────────────────────────── */
.summary-bar { display: flex; flex-wrap: wrap; gap: 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.stat-cell { padding: 10px 20px; border-right: 1px solid var(--border); }
.stat-cell:last-child { border-right: none; }
.stat-val { font-size: 22px; font-weight: 700; line-height: 1; display: block; }
.stat-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; display: block; }
.needs-attention { background: var(--amber-bg); border-bottom: 2px solid var(--amber-border); padding: 8px 20px; font-size: 12px; color: #92400e; font-weight: 600; display: none; }

/* ── Layout ─────────────────────────────────────────────── */
.layout { display: grid; grid-template-columns: 1fr 300px; gap: 0; max-width: 1200px; margin: 0 auto; padding: 20px 20px 40px; }
@media(max-width: 900px){ .layout { grid-template-columns: 1fr; } }

/* ── Day Tabs ────────────────────────────────────────────── */
.day-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
.day-tab { padding: 8px 14px; border-radius: 4px 4px 0 0; font-size: 12px; font-weight: 600; color: var(--muted); background: none; border: 1px solid transparent; border-bottom: none; cursor: pointer; }
.day-tab:hover { background: var(--surface); }
.day-tab.active { background: var(--bg); border-color: var(--border); color: var(--text); margin-bottom: -2px; border-bottom-color: var(--bg); }
.day-panel { display: none; }
.day-panel.active { display: block; }

/* ── Session Rows ────────────────────────────────────────── */
.session-block { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.session-row { display: grid; grid-template-columns: 78px 1fr 120px 116px 200px; align-items: center; gap: 0 12px; padding: 10px 14px; background: var(--surface); }
.session-row:hover { background: #eef0f3; }
.session-time { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.session-info { min-width: 0; cursor: default; }
.session-title { font-weight: 600; font-size: 13px; line-height: 1.3; margin-bottom: 2px; }
.session-sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Room column */
.session-type-col { display: flex; align-items: center; }
.session-room-val { font-size: 12px; color: var(--text); font-weight: 500; }
.badge-general   { background: #ede9fe; color: #6d28d9; }
.badge-client    { background: #dbeafe; color: #1d4ed8; }
.badge-solution  { background: #dcfce7; color: #15803d; }
.badge-collab    { background: #fef9c3; color: #92400e; }
.badge-fair      { background: #fce7f3; color: #9d174d; }
.badge-roundtable{ background: #e0f2fe; color: #0369a1; }
.badge-playback  { background: #f0fdf4; color: #166534; }
.badge-default   { background: var(--surface); color: var(--muted); }
/* Action buttons */
.row-btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: 100%; font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; white-space: nowrap; user-select: none; }
.row-btn:hover { background: #f0f4ff; border-color: #93c5fd; color: #1d4ed8; }
.row-btn.active { background: #eff6ff; border-color: #3b82d4; color: #1d4ed8; }
/* Download Status column */
.files-col { display: flex; flex-direction: column; gap: 3px; }
.files-col-btn { display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; width: 100%; text-align: left; flex-wrap: wrap; }
.files-col-btn:hover { background: #f0f4ff; border-color: #93c5fd; }
.files-col-btn.active { background: #eff6ff; border-color: #3b82d4; }
.files-col-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); white-space: nowrap; margin-right: 2px; }
.fs-pill { display: inline-flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; width: 24px; height: 24px; border-radius: 4px; }
.fs-update { background: #fde68a; color: #92400e; animation: dl-pulse 1.6s ease-in-out infinite; }
.fs-new    { background: #dbeafe; color: #1d4ed8; }
.fs-done   { background: var(--green-bg); color: var(--green); }
.fs-hold   { background: var(--amber-bg); color: var(--amber); }
.fs-nofile { background: var(--gray-bg);  color: var(--gray); font-size: 10px; }
/* Legend bar */
.legend-bar { display: flex; align-items: center; gap: 14px; padding: 6px 14px; background: #f7f8fa; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.legend-bar span { font-size: 10.5px; color: var(--muted); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text); }
.legend-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
/* AV chips — inside AV details panel */
.av-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.av-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; border-radius: 4px; padding: 2px 7px; background: #f0f4ff; border: 1px solid #dbeafe; color: #1e3a8a; white-space: nowrap; }
.av-chip .chip-k { font-weight: 700; color: var(--muted); margin-right: 2px; }
.av-chip.chip-roomsetup { background: #f7f8fa; border-color: var(--border); color: var(--text); max-width: 100%; white-space: normal; line-height: 1.4; }
/* Sub-panels */
.sub-panel { display: none; border-top: 1px solid var(--border); padding: 12px 14px; }
.sub-panel.open { display: block; }
.sub-panel-av { background: #fafbff; }
.sub-panel-files { background: #fff; }

/* ── Files Table ─────────────────────────────────────────── */
.files-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.files-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.files-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.files-table tr:last-child td { border-bottom: none; }

.status-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 10px; white-space: nowrap; }
.pill-approved     { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.pill-updated      { background: var(--blue-bg);  color: var(--blue);  border: 1px solid var(--blue-border); }
.pill-onhold       { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
.pill-nofile       { background: var(--gray-bg);  color: var(--gray);  border: 1px solid var(--gray-border); }
.pill-distributed  { background: #f3e8ff; color: #7c3aed; border: 1px solid #d8b4fe; }

/* ── Download button states ───────────────────────────────── */
.dl-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 4px 12px; text-decoration: none; white-space: nowrap; cursor: pointer; border: none; }
.dl-btn:hover { filter: brightness(.92); text-decoration: none; }
.dl-new      { background: var(--accent); color: #fff; }
.dl-done     { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.dl-update   { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); animation: dl-pulse 1.6s ease-in-out infinite; }
.dl-nolink   { color: var(--muted); font-size: 11.5px; font-style: italic; }
@keyframes dl-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* AV table key cells */
.chip-k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 5px 12px 5px 0; width: 120px; vertical-align: top; white-space: nowrap; }
.av-note { margin-top: 10px; padding: 8px 10px; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 4px; font-size: 12px; color: #78350f; }
.av-note strong { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #92400e; margin-bottom: 2px; }

.no-files-msg { color: var(--muted); font-size: 12px; font-style: italic; padding: 6px 0; }

/* ── Room Filter ──────────────────────────────────────────── */
.room-filter-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.room-filter-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; white-space: nowrap; }
.room-btn { font-size: 11.5px; font-weight: 500; padding: 3px 11px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; white-space: nowrap; transition: background .1s; }
.room-btn:hover { background: #e5e7eb; color: var(--text); }
.room-btn.active { background: #1f2328; color: #fff; border-color: #1f2328; font-weight: 600; }
.room-btn.all-rooms.active { background: var(--accent); border-color: var(--accent); }
.session-block.room-hidden { display: none; }

/* ── Changelog Sidebar ────────────────────────────────────── */
.sidebar { padding-left: 20px; }
@media(max-width: 900px){ .sidebar { padding-left: 0; padding-top: 20px; } }
.sidebar-header { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.changelog-list { list-style: none; }
.changelog-item { padding: 9px 0; border-bottom: 1px solid var(--border); }
.changelog-item:last-child { border-bottom: none; }
.cl-ts { font-size: 10.5px; color: var(--muted); }
.cl-session { font-size: 12px; font-weight: 600; margin: 2px 0 1px; }
.cl-detail { font-size: 11.5px; color: var(--muted); }
.cl-pill { font-size: 10px; font-weight: 700; border-radius: 3px; padding: 1px 5px; display: inline-block; }
.cl-pill-from { background: var(--gray-bg); color: var(--gray); }
.cl-pill-to-approved { background: var(--green-bg); color: var(--green); }
.cl-pill-to-updated  { background: var(--blue-bg);  color: var(--blue); }
.cl-pill-to-onhold   { background: var(--amber-bg); color: var(--amber); }
.cl-empty { color: var(--muted); font-size: 12px; font-style: italic; }

/* ── Loading / Error ─────────────────────────────────────── */
#loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

null,"showInDashboard":true},{"id":"monday-16-15-belle-epoque-ballr-generic-data-architecture-d","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"17:00","sessionType":"Client Roundtable","track":null,"title":"Generic Data Architecture, Data Discovery on Z","description":null,"speakers":"Sueli Almeida","room":"Belle Epoque Ballroom","roomSetup":"Stage with podium, 4 soft chairs and side tables, schoolroom 240","projection":"not required","microphones":"5 wireless mics plus 3 catchboxes","podium":true,"timer":null,"monitor":"2 monitors for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-teun-untitled","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"17:00","sessionType":"Client Roundtable","track":null,"title":"(Untitled)","description":null,"speakers":null,"room":"Teun","roomSetup":"Stage with podium, 4 soft chairs and side tables, schoolroom 240","projection":"not required","microphones":"5 wireless mics plus 3 catchboxes","podium":true,"timer":null,"monitor":"2 monitors for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-ibm-atlas-system-intelligen","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"IBM Atlas: System intelligence that discovers everything so you can understand anything","description":"See IBM Atlas in action as it discovers and maps relationships across your IT environment, from hardware and operating systems to middleware, software, and business applications. Through a live demonstration, attendees will explore Atlas’s dynamic topology visualization and AI-powered chat experience, enabling users to quickly understand dependencies, answer environment questions, and gain actionable insights. Learn how organizations are leveraging Atlas for change management, audit readiness, application refactoring, business service mapping, and drift detection, while also helping shape the future of the platform through direct feedback.","speakers":"Meghan McGrath","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-would-you-trust-an-ai-agent","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Would You Trust an AI Agent With This?","description":"Experience Agentic AI in action within IBM Concert for Z and see how AI can accelerate problem determination by analyzing system signals, identifying likely causes, gathering evidence, and recommending next steps. After the live demonstration, participate in a quick interactive voting exercise where you'll decide whether specific operational tasks should be automated by AI, assisted by AI, or remain under human control. This engaging session explores the evolving relationship between human expertise and AI-driven operations, highlighting how Agentic AI can help address knowledge gaps,reduce reliance on specialized experts, and improve decision-making across complex environments. Attendees will gain insight into the practical applications of autonomous operations while helping shape the future direction of Concert for Z's Agentic AI capabilities.","speakers":"Nadia Fendrich","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-project-brain-bank-turning","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Project Brain Bank: Turning IBM Z knowledge into trusted AI-ready guidance","description":"Discover Project Brain Bank, an early concept for transforming scattered IBM Z knowledge—from documentation and support insights to product expertise and operational learnings—into structured, AI-generated guidance backed by trusted sources. Attendees will see a simple before-and-after demonstration showing how information can be consolidated into actionable answers with supporting evidence, recommended next steps, and source transparency. Visitors will be invited to evaluate an AI-generated response and share what would make it trustworthy enough for real-world use. Through a quick interactive activity, participants will help shape the future of AI-assisted IBM Z guidance by identifying the trust signals, evidence, and transparency mechanisms needed to confidently leverage AI in enterprise environments.","speakers":"Ivan Dovgan","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-software-management-as-code","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Software Management-as-Code - IBM Z Install","description":"Experience a hands-on demonstration of IBM Z Install and see how software management can be transformed through a GitOps-driven, software management-as-code approach. Attendees will explore a prototype that uses standard repositories to configure, deploy, and track z/OS software across partitions, providing a centralized inventory of what is installed, where it is running, and how it was deployed. The session showcases a self-service, AI-assisted experience that brings together software installation, governance, and auditability using industry-standard workflows. Learn how IBM is extending Infrastructure-as-Code, Configuration-as-Code, and Policy-as-Code principles to z/OS software management, helping organizations improve visibility, streamline operations, and accelerate time to value while maintaining business controls and compliance.","speakers":"Andrew Sica","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-ibm-project-polaris-tech-pre","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"IBM Project Polaris Tech Preview 2.0 and Beyond","description":"Explore how IBM Project Polaris is extending As-Code practices across z/OS, moving beyond isolated configuration tasks to support Networking, Storage Management, Workload Manager (WLM), and other core system domains. Through a hands-on demonstration, attendees will see how configurations and policies can be defined, validated, and managed using modern workflows, with guidance from intelligent automation and agentic AI. The session highlights how Polaris helps both new and experienced system programmers adopt industry-standard As-Code approaches to improve consistency, governance, reviewability, and confidence when managing change. Visitors will have the opportunity to interact with the experience, provide feedback, and help shape the future of As-Code management for enterprise z/OS environments.","speakers":"Roger Bales","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-workload-expansion-the-futu","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"Workload Expansion: The Future of IBM Z","description":"As organizations seek to modernize and consolidate more workloads within their existing data center footprint, the IBM Z ecosystem is evolving to support new architectures, deployment models, and development patterns. This interactive exhibit explores IBM’s vision for a more secure, scalable, and versatile platform, highlighting how emerging technologies—including architectures such as ARM—can complement traditional workloads and create new opportunities for innovation on IBM Z. Attendees will participate in collaborative activities designed to uncover new use cases, identify adoption opportunities, and explore where hybrid architectures could deliver the greatest business value. Participants will help shape the direction of an expanded IBM Z ecosystem that brings together mission-critical reliability with modern application and infrastructure experiences.","speakers":"Anthony Cocuzza","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-16-15-ballroom-foyer-from-client-configuration-da","day":"Monday","date":"2026-10-19","startTime":"16:15","endTime":"19:00","sessionType":"Z Design Fair","track":null,"title":"From Client Configuration Data to Simplification Signals","description":"The IBM Z Configuration Collection Program demonstrates how real-world client configuration data can be used to identify opportunities for simplification across the platform. This exhibit showcases how IBM has analyzed customer configuration data and identified a subset of configuration settings as candidates for simplification, helping teams better understand where complexity exists and where focused improvements may provide the greatest value. Attendees will see how these insights are already being used to inform IBM Z simplification efforts and explore how configuration intelligence could influence future capabilities such as Project Polaris and the z/OS configuration registry. Visitors will also have the opportunity to discuss their own configuration challenges and help shape future priorities for reducing friction, improving usability, and simplifying system management.","speakers":"Shelley Brand","room":"Ballroom Foyer","roomSetup":"Each station needs monitor, monitor stand, high-top table, chair and easel – to be set up before 3:30pm","projection":"Design Fair Station","microphones":null,"podium":false,"timer":null,"monitor":"Flatscreen on floorstand","specialReqs":"Will need large sticky pad for easel","files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"monday-18-00-ballroom-foyer-reception","day":"Monday","date":"2026-10-19","startTime":"18:00","endTime":"19:00","sessionType":"Networking","track":null,"title":"Reception","description":null,"speakers":null,"room":"Ballroom Foyer","roomSetup":"High top tables","projection":null,"microphones":null,"podium":false,"timer":null,"monitor":null,"specialReqs":nu te":"2026-10-21","startTime":"13:30","endTime":"14:15","sessionType":"Solution Review","track":"Application","title":"Streamlining COBOL Modernization with IBM COBOL Elevate for z/OS","description":"Enterprise clients face fragmentedCOBOL modernization workflowsrequiring many hours of setup,specialized skills, and manualcoordination across compilerupgrades, performance analysis, andoptimization.This complexity delays modernizationinitiatives and increases technicaldebt.IBM COBOL Elevate for z/OSstreamlines the entire process with anintegrated, end-to-end modernizationexperience that accelerates COBOLapplication performance, upgradesCOBOL compiler versions, andgenerates actionable modernizationinsights—all within a unified platformbuilt for speed and simplicity.","speakers":"Reid Copeland","room":"Teun","roomSetup":"Podium, classroom 80","projection":"Presenter","microphones":"4 wireless mics plus 2 handheld mics","podium":true,"timer":null,"monitor":"venue provided screen; 1 monitor for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-13-30-belle-epoque-ballr-project-polaris-roadmap-lea","day":"Wednesday","date":"2026-10-21","startTime":"13:30","endTime":"14:15","sessionType":"Solution Review","track":"Infrastructure","title":"Project Polaris Roadmap: Leading to the z/OS Next GA Experience","description":"Project Polaris is shaping the z/OS NextGA experience by moving z/OSmanagement toward a simplified, As-Code, AI-assisted model. This briefingwill show the roadmap leading to z/OSNext GA, highlighting key configurationupdates across a staged model:bringing up a minimal z/OS system,enabling Polaris on top of that basesystem, and expanding toward abootable, standard z/OS imagemanaged through Configuration-as-Code.Specific focus areas include a morecomplete As-Code configuration picturebeyond parmlibs, including WLM,storage, and networking; activeconfiguration/current-state awareness;and agentic assistance to help Chrisunderstand settings, validate changes,and build confidence.","speakers":"Andrew Sica","room":"Belle Epoque Ballroom","roomSetup":"Stage with podium, 4 soft chairs and side tables, schoolroom 240","projection":"AV team","microphones":null,"podium":true,"timer":null,"monitor":"Yes","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-13-30-sancy-z-database-assistant-update","day":"Wednesday","date":"2026-10-21","startTime":"13:30","endTime":"14:15","sessionType":"Solution Review","track":"Data & AI","title":"Z Database Assistant Update and Journey","description":"IBM Z Database Assistant delivers aunified, intelligent workspace poweredby agentic AI to augment databaseadministrators (DBAs) across IMS andDb2 for z/OS environments.In this session, we will provide an updateon the evolution of IBM Z DatabaseAssistant since the June GA release andengage the Council for feedback.The session will cover both IMS and Db2perspectives, including:• Enhancements to core capabilitiesbased on feedback in 2Q.• Sponsor user feedback, particularlyaround installation and configurationexperience• Progress on tooling integration,including key priorities and upcominginvestments• Updates to Db2 distributedconnection management, includingrecent enhancements","speakers":"Sueli Almeida","room":"Sancy","roomSetup":"Podium, classroom 44","projection":"Presenter","microphones":"4 wireless mics plus 2 handheld mics","podium":true,"timer":null,"monitor":"venue provided screen; 1 monitor for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-13-30-tiffany-shah-part-1-ibm-z-security-trans","day":"Wednesday","date":"2026-10-21","startTime":"13:30","endTime":"14:15","sessionType":"Solution Review","track":"Security","title":"Part 1: IBM Z Security Transformation","description":"As AI and frontier models accelerate the speed, scale, and sophistication of cyber threats, organizations can no longer rely on isolated controls or human speed response. This Part 1 IBM ZDC session explores IBM Z's security transformation strategy across the entire hardware and software stack, delivering continuous protection throughout the application, data, and platform lifecycle. Attendees will gain insight into a full stack, NIST aligned approach that integrates security, compliance, cyber resilience, and AI-driven automation to identify, protect, detect, respond, and recover at system speed.","speakers":"Bryan Childs, Robert Enochs","room":"Tiffany/Shah","roomSetup":"Podium, classroom 75","projection":"Presenter","microphones":"4 wireless mics plus 2 handheld mics","podium":true,"timer":null,"monitor":"venue provided screen; 1 monitor for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-14-30-belle-epoque-ballr-ibm-research","day":"Wednesday","date":"2026-10-21","startTime":"14:30","endTime":"15:30","sessionType":"General Session","track":null,"title":"IBM Research","description":null,"speakers":"Donna Dillenberger","room":"Belle Epoque Ballroom","roomSetup":"Stage with podium, 4 soft chairs and side tables, schoolroom 240","projection":"AV team","microphones":"5 wireless mics plus 3 catchboxes","podium":true,"timer":"60","monitor":"2 monitors for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-15-30-ballroom-foyer-untitled","day":"Wednesday","date":"2026-10-21","startTime":"15:30","endTime":"16:00","sessionType":"Break","track":null,"title":"(Untitled)","description":null,"speakers":null,"room":"Ballroom Foyer","roomSetup":null,"projection":null,"microphones":null,"podium":false,"timer":null,"monitor":null,"specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":false},{"id":"wednesday-16-00-belle-epoque-ballr-expedite-problem-diagnosis-i","day":"Wednesday","date":"2026-10-21","startTime":"16:00","endTi tup":"Podium, classroom 80","projection":"Presenter","microphones":"4 wireless mics plus 2 handheld mics","podium":true,"timer":null,"monitor":"venue provided screen; 1 monitor for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-16-00-sancy-agentic-security","day":"Wednesday","date":"2026-10-21","startTime":"16:00","endTime":"16:45","sessionType":"Solution Review","track":"Security","title":"Agentic Security","description":"Execution-capable AI agents introduce new z/OS privilege-management challenges because they can submit jobs, invoke APIs, modify resources, and delegate work. Traditional Identity and Access Management (IAM) is not enough; each action must be governed across its lifecycle and tied to identity, task intent, RACF enforcement, and audit reconstruction. We invite you to help shape what comes next as we design AI IAM mechanisms that enable safe and secure development, deployment and operation of execution-capable AI agents on z/OS.","speakers":"Pradeep Parameshwaran","room":"Sancy","roomSetup":"Podium, classroom 44","projection":"Presenter","microphones":"4 wireless mics plus 2 handheld mics","podium":true,"timer":null,"monitor":"venue provided screen; 1 monitor for speaker","specialReqs":null,"files":[],"avNote":null,"operatorNote":null,"showInDashboard":true},{"id":"wednesday-17-00-teun-bringing-agentic-workflows-t","day":"Wednesday","date":"2026-10-21","startTime":"17:00","endTime":"17:45","sessionType":"Solution Review","track":"Application","title":"Bringing agentic workflows to CI/CD with IBM Pipeline Automation for Z to accelerate how apps are built, validated, and deployed","description":"Validate the implementation of cross-application dependencies support across build and deploy workflows​. Identify adoption barriers and gaps in enabling end-to-end pipeline integration​. Prioritize enhancements to improve usability, interoperability, and release coordination​.","speakers":"Ric // ── Download-tracking ─────────────────────────────────────
// Stored in localStorage: { boxFileId → ISO timestamp of last download }
function getDownloadLog() {
  try { return JSON.parse(localStorage.getItem("av_downloads") || "{}"); } catch(e) { return {}; }
}
function recordDownload(boxFileId) {
  const log = getDownloadLog();
  log[boxFileId] = new Date().toISOString();
  localStorage.setItem("av_downloads", JSON.stringify(log));
}

// Returns "distributed" | "new" | "done" | "update" | "nolink"
function dlState(f) {
  if (f.status === "distributed") return "distributed"; // global shared state — set by AV lead
  if (!f.boxFileId) return "nolink";
  const log = getDownloadLog();
  const lastDl = log[f.boxFileId];
  if (!lastDl) return "new";                                    // never downloaded locally
  if (f.updatedAt && f.updatedAt > lastDl) return "update";    // file updated since last download
  return "done";
}

// Called from onclick — records download then flips button to "done"
function onDownload(boxFileId, btnId) {
  recordDownload(boxFileId);
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.className = "dl-btn dl-done";
    btn.innerHTML = "✓ Downloaded";
  }
}

// ── Boot ──────────────────────────────────────────────────
let avData = null;
let activeRoom = null;   // null = All Rooms

async function loadData() {
  // Tier 1: GitHub raw (works on GitHub Pages + any network connection)
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const d = await res.json();
      if (d && d.sessions) {
        avData = d;
        document.getElementById("last-refresh").textContent = "Updated " + fmtTs(avData.lastUpdated);
        return true;
      }
    }
  } catch(_) {}

  // Tier 2: Relative path (works via local HTTP server or GitHub Pages)
  try {
    const res = await fetch("../data/av-data.json?t=" + Date.now());
    if (res.ok) {
      const d = await res.json();
      if (d && d.sessions) {
        avData = d;
        document.getElementById("last-refresh").textContent = "Local data";
        return true;
      }
    }
  } catch(_) {}

  // Tier 3: Inline embedded data (always works, including file://)
  try {
    if (typeof EMBEDDED_DATA !== "undefined" && EMBEDDED_DATA.sessions) {
      avData = EMBEDDED_DATA;
      document.getElementById("last-refresh").textContent = "Embedded data";
      return true;
    }
  } catch(_) {}

  document.getElementById("loading").innerHTML = `<strong style="color:#dc2626">Error loading data.</strong><br>Check network connection and try refreshing.`;
  return false;
}

window.addEventListener("DOMContentLoaded", async () => {
  const ok = await loadData();
  if (!ok) return;
  try {
    renderAll();
  } catch(e) {
    document.getElementById("loading").innerHTML =
      `<strong style="color:#dc2626">Render error: ${e.message}</strong><br><pre style="font-size:11px;text-align:left;margin-top:8px">${e.stack}</pre>`;
    return;
  }
  document.getElementById("loading").style.display  = "none";
  document.getElementById("app").style.display      = "block";
  document.getElementById("summary-bar").style.display = "flex";
  setInterval(refresh, REFRESH_MS);
});

async function refresh() {
  const prev = avData ? JSON.stringify(avData.lastUpdated) : null;
  const ok = await loadData();
  if (!ok) return;
  if (JSON.stringify(avData.lastUpdated) !== prev) {
    try { renderAll(); } catch(_) {}
  }
}

// ── Render ─────────────────────────────────────────────────
function renderAll() {
  renderSummary();
  renderDays();
  renderChangelog();
  renderNeedsAttention();
}

// Sessions visible to the vendor team — only those explicitly flagged in admin
function vendorSessions() {
  return (avData.sessions || []).filter(s => s.showInDashboard === true);
}

function renderSummary() {
  const sessions = vendorSessions();
  let files=0, approved=0, updated=0, onhold=0, noFile=0;
  for (const s of sessions) {
    const sf = s.files || [];
    files    += sf.length;
    approved += sf.filter(f=>f.status==="approved").length;
    updated  += sf.filter(f=>f.status==="updated").length;
    onhold   += sf.filter(f=>f.status==="onhold").length;
    if (sf.length === 0) noFile++;
  }
  document.getElementById("s-sessions").textContent = sessions.length;
  document.getElementById("s-files").textContent    = files;
  document.getElementById("s-approved").textContent = approved;
  document.getElementById("s-updated").textContent  = updated;
  document.getElementById("s-onhold").textContent   = onhold;
  document.getElementById("s-nofile").textContent   = noFile;
}

function renderNeedsAttention() {
  const bar = document.getElementById("needs-attention");
  const updated = vendorSessions().filter(s => s.files && s.files.some(f => f.status === "updated"));
  if (updated.length > 0) {
    bar.style.display = "block";
    bar.textContent   = `⚠ ${updated.length} session${updated.length>1?"s have":" has"} updated files — re-download required: ` +
      updated.map(s => s.title.slice(0,40)).join("; ");
  } else {
    bar.style.display = "none";
  }
}

function renderDays() {
  const allVendor = vendorSessions();
  const days = DAY_ORDER.filter(d => allVendor.some(s => s.day === d));
  const tabsEl      = document.getElementById("day-tabs");
  const panelsEl    = document.getElementById("day-panels");
  const filterBarEl = document.getElementById("room-filter-bar");

  if (!days.length) {
    tabsEl.innerHTML = "";
    filterBarEl.style.display = "none";
    panelsEl.innerHTML = `<p style="color:var(--muted);font-size:13px;padding:24px 0;text-align:center">No sessions have been marked for the dashboard yet.<br><span style="font-size:11.5px">Use the Dashboard checkbox in the AV Admin to include sessions.</span></p>`;
    return;
  }

  // Build room list from current data
  const rooms = [...new Set(allVendor.map(s => s.room).filter(Boolean))].sort();

  // Validate activeRoom still exists
  if (activeRoom && !rooms.includes(activeRoom)) activeRoom = null;

  // Render room filter bar
  filterBarEl.style.display = "flex";
  filterBarEl.innerHTML =
    `<span class="room-filter-label">Room:</span>` +
    `<button class="room-btn all-rooms${!activeRoom?" active":""}" onclick="setRoomFilter(null)">All Rooms</button>`;

  // Append room buttons via DOM — avoids innerHTML quoting issues with room names
  rooms.forEach(r => {
    const cnt = allVendor.filter(s => s.room === r).length;
    const btn = document.createElement("button");
    btn.className = "room-btn" + (activeRoom === r ? " active" : "");
    btn._roomName = r;                            // store for setRoomFilter matching
    btn.textContent = `${r} `;
    const countEl = document.createElement("span");
    countEl.style.cssText = "font-size:10px;opacity:.7";
    countEl.textContent = cnt;
    btn.appendChild(countEl);
    btn.addEventListener("click", () => setRoomFilter(r));
    filterBarEl.appendChild(btn);
  });

  // Preserve active day across refreshes
  const activeDay = (tabsEl.querySelector(".day-tab.active") || {}).dataset?.day || days[0];

  tabsEl.innerHTML = "";
  panelsEl.innerHTML = `<div class="legend-bar">
    <span class="legend-title">Download Status:</span>
    <span class="legend-item"><span class="fs-pill fs-update" style="width:20px;height:20px;font-size:12px">↻</span> Re-download required</span>
    <span class="legend-item"><span class="fs-pill fs-new"    style="width:20px;height:20px;font-size:12px">⬇</span> Download needed</span>
    <span class="legend-item"><span class="fs-pill fs-done"   style="width:20px;height:20px;font-size:12px">✓</span> Downloaded / Distributed</span>
    <span class="legend-item"><span class="fs-pill fs-hold"   style="width:20px;height:20px;font-size:12px">⏸</span> On Hold — awaiting file</span>
    <span class="legend-item"><span class="fs-pill fs-nofile" style="width:20px;height:20px;font-size:12px">—</span> No file attached</span>
    <span style="margin-left:4px;font-style:italic">· Hover a pill to see file name · Click Download Status to open/close full details</span>
  </div>`;

  days.forEach(day => {
    const sessions = allVendor.filter(s => s.day === day);
    const date     = sessions[0]?.date ? fmtDateShort(sessions[0].date) : "";

    const tab = document.createElement("button");
    tab.className = "day-tab" + (day === activeDay ? " active" : "");
    tab.textContent = `${day} ${date}`;
    tab.dataset.day = day;
    tab.onclick = () => switchDay(day);
    tabsEl.appendChild(tab);

    const panel = document.createElement("div");
    panel.className = "day-panel" + (day === activeDay ? " active" : "");
    panel.id = "panel-" + day;
    sessions.forEach(s => panel.appendChild(buildSessionBlock(s)));
    panelsEl.appendChild(panel);
  });

  // Apply current room filter after building
  applyRoomFilter();
}

function setRoomFilter(room) {
  activeRoom = room;
  document.querySelectorAll(".room-btn").forEach(b => {
    const isAll = b.classList.contains("all-rooms");
    b.classList.toggle("active", room === null ? isAll : b._roomName === room);
  });
  applyRoomFilter();
}

function applyRoomFilter() {
  document.querySelectorAll(".session-block[data-room]").forEach(block => {
    const match = !activeRoom || block.dataset.room === activeRoom;
    block.classList.toggle("room-hidden", !match);
  });
}

function buildSessionBlock(s) {
  const block = document.createElement("div");
  block.className = "session-block";
  if (s.room) block.dataset.room = s.room;
  const [badgeClass, badgeLabel] = TYPE_BADGE[s.sessionType] || ["badge-default", s.sessionType];
  const files = s.files || [];

  block.innerHTML = `
    <div class="session-row">
      <span class="session-time">${s.startTime || ""}${s.endTime?"–"+s.endTime:""}</span>
      <div class="session-info">
        <div class="session-title">${esc(s.title)}</div>
        <div class="session-sub">${s.speakers ? esc(s.speakers.slice(0,80)) : "&nbsp;"}</div>
      </div>
      <div class="session-type-col">
        <span class="session-room-val">${esc(s.room || "—")}</span>
      </div>
      <div>
        <button class="row-btn" id="avbtn-${s.id}" onclick="togglePanel('${s.id}','av')">
          AV Details
        </button>
      </div>
      <div class="files-col">
        <button class="files-col-btn" id="filesbtn-${s.id}" onclick="togglePanel('${s.id}','files')">
          <span class="files-col-label">Download Status</span>

    </div>
    <div class="sub-panel sub-panel-files" id="files-panel-${s.id}">
      ${buildFilesSection(s)}

  return block;
}

function buildAVChips(s) {
  const rows = [
    s.room        && `<tr><td class="chip-k">Room</td><td>${esc(s.room)}</td></tr>`,
    s.projection  && `<tr><td class="chip-k">Projection</td><td>${esc(s.projection)}</td></tr>`,
    s.microphones && `<tr><td class="chip-k">Mics</td><td>${esc(s.microphones)}</td></tr>`,
    s.podium      && `<tr><td class="chip-k">Podium</td><td>Yes</td></tr>`,
    s.timer       && `<tr><td class="chip-k">Timer</td><td>${esc(String(s.timer))} min</td></tr>`,
    s.monitor     && `<tr><td class="chip-k">Monitor</td><td>${esc(s.monitor)}</td></tr>`,
    s.roomSetup   && `<tr><td class="chip-k">Room Setup</td><td>${esc(s.roomSetup)}</td></tr>`,
    s.specialReqs && `<tr><td class="chip-k">Special Reqs</td><td>${esc(s.specialReqs)}</td></tr>`,
  ].filter(Boolean);
  if (!rows.length) return `<p style="color:var(--muted);font-size:12px;font-style:italic">No AV details on file.</p>`;
  return `<table style="font-size:12.5px;border-collapse:collapse;width:100%">
    ${rows.map(r => r.replace('<tr>','<tr style="border-bottom:1px solid var(--border)">')).join("")}
  </table>`;
}

// Inline icon-only pills shown on the collapsed session row
function buildRowFilePills(files) {
  if (!files.length) return `<span class="fs-pill fs-nofile" title="No files attached">—</span>`;
  return files.map(f => {
    const state = dlState(f);
    const tip   = f.fileName || f.fileType || "file";
    if (state === "update")      return `<span class="fs-pill fs-update" title="↻ Update — re-download: ${tip}">↻</span>`;
    if (state === "new")         return `<span class="fs-pill fs-new"    title="⬇ Download needed: ${tip}">⬇</span>`;
    if (state === "distributed") return `<span class="fs-pill fs-done"   title="✓ Distributed: ${tip}">✓</span>`;
    if (state === "done")        return `<span class="fs-pill fs-done"   title="✓ Downloaded: ${tip}">✓</span>`;
    if (f.status === "onhold")   return `<span class="fs-pill fs-hold"   title="⏸ On Hold: ${tip}">⏸</span>`;
    return `<span class="fs-pill fs-nofile" title="${tip}">—</span>`;
  }).join("");
}

function buildFilesSummary(files) {
  if (!files.length) return '<span style="font-size:10.5px;color:var(--amber)">no files</span>';
  const hasUpdate = files.some(f => dlState(f) === "update");
  const d = files.filter(f=>f.status==="distributed").length;
  const a = files.filter(f=>f.status==="approved").length;
  const u = files.filter(f=>f.status==="updated").length;
  const h = files.filter(f=>f.status==="onhold").length;
  const parts = [];
  if (hasUpdate) parts.push(`<span style="color:var(--amber);font-size:10.5px;font-weight:700">↻ update</span>`);
  if (d) parts.push(`<span style="color:#7c3aed;font-size:10.5px;font-weight:700">${d}⬇</span>`);
  if (a) parts.push(`<span style="color:var(--green);font-size:10.5px;font-weight:700">${a}✓</span>`);
  if (u && !hasUpdate) parts.push(`<span style="color:var(--blue);font-size:10.5px;font-weight:700">${u}↑</span>`);
  if (h) parts.push(`<span style="color:var(--amber);font-size:10.5px;font-weight:700">${h}⏸</span>`);
  return parts.join(" ");
}

function buildFilesSection(s) {
  const files = s.files || [];
  if (!files.length) return `<p class="no-files-msg">No files uploaded yet.</p>`;

  const rows = files.map((f, i) => {
    const pillClass = {
      "approved":"pill-approved","updated":"pill-updated","distributed":"pill-distributed",
      "onhold":"pill-onhold","nofile":"pill-nofile","pending":"pill-nofile"

    const statusLabel = {
      "approved":"Approved","updated":"Updated","onhold":"On Hold",
      "distributed":"Distributed","nofile":"No File Needed","pending":"Pending"

    const updFmt = f.updatedAt ? fmtTs(f.updatedAt) : "—";

    const state = dlState(f);
    const btnId = `dlbtn-${s.id}-${i}`;
    let dlBtn;
    if (state === "distributed") {
      // Global state: AV lead confirmed distributed — show as a download link but already marked
      const href = f.boxFileId ? `https://ibm.box.com/s/${esc(f.boxFileId)}` : null;

        ? `<a id="${btnId}" class="dl-btn dl-done" href="${href}" target="_blank" rel="noopener"

        : `<span class="dl-nolink">✓ Distributed</span>`;
    } else if (state === "nolink") {
      dlBtn = `<span class="dl-nolink">No link yet</span>`;
    } else {
      const href  = `https://ibm.box.com/s/${esc(f.boxFileId)}`;
      const cls   = state === "update" ? "dl-btn dl-update"
                  : state === "done"   ? "dl-btn dl-done"
                                       : "dl-btn dl-new";
      const label = state === "update" ? "↻ Update Available"
                  : state === "done"   ? "✓ Downloaded"
                                       : "⬇ Download";
      dlBtn = `<a id="${btnId}" class="${cls}" href="${href}" target="_blank" rel="noopener"
                 onclick="onDownload('${esc(f.boxFileId)}','${btnId}')">${label}</a>`;
    }

    return `<tr>
      <td>${esc(f.fileType||"")}</td>
      <td>${esc(f.fileName||"(unnamed)")}</td>
      <td><span class="status-pill ${pillClass}">${esc(statusLabel)}</span></td>
      <td style="font-size:11.5px;color:var(--muted)">${updFmt}</td>
      <td>${dlBtn}</td>
    </tr>`;
  }).join("");

  return `<table class="files-table">
    <thead><tr>
      <th style="width:120px">Type</th>
      <th>Name</th>
      <th style="width:160px">Status</th>
      <th style="width:110px">Updated</th>
      <th style="width:130px"></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderChangelog() {
  const list = document.getElementById("changelog-list");
  const log  = (avData.changelog || []).slice(0, 50);
  if (!log.length) {
    list.innerHTML = `<li class="cl-empty">No changes recorded yet.</li>`;
    return;
  }
  list.innerHTML = log.map(e => {
    const from = e.from || e.oldStatus || "";
    const to   = e.to   || e.newStatus || "";
    const toClass = {
      "approved":"cl-pill-to-approved","updated":"cl-pill-to-updated","onhold":"cl-pill-to-onhold"
    }[to] || "";
    const fmtStatus = s => ({"approved":"Approved","updated":"Updated","onhold":"On Hold","pending":"Pending","nofile":"No File Needed","removed":"Removed"}[s] || s);
    return `<li class="changelog-item">
      <div class="cl-ts">${fmtTs(e.ts)}</div>
      <div class="cl-session">${esc(e.day)} · ${esc(e.sessionTitle||"").slice(0,50)}</div>
      <div class="cl-detail">${esc(e.fileType||"")} &nbsp;
        <span class="cl-pill cl-pill-from">${esc(fmtStatus(from))}</span>
        → <span class="cl-pill ${toClass}">${esc(fmtStatus(to))}</span>
      </div>
    </li>`;
  }).join("");
}

// ── Interaction ────────────────────────────────────────────
function togglePanel(sid, which) {
  const avPanel    = document.getElementById("av-panel-"    + sid);
  const filesPanel = document.getElementById("files-panel-" + sid);
  const avBtn      = document.getElementById("avbtn-"       + sid);
  const filesBtn   = document.getElementById("filesbtn-"    + sid);
  if (which === "av") {
    const open = avPanel.classList.toggle("open");
    avBtn.classList.toggle("active", open);
  } else {
    const open = filesPanel.classList.toggle("open");
    filesBtn.classList.toggle("active", open);
  }
}

// After a file is downloaded, also refresh the row pills so state updates immediately
const _origOnDownload = onDownload;
function onDownload(boxFileId, btnId) {
  _origOnDownload(boxFileId, btnId);
  // Find which session owns this file and refresh its row pills
  if (!avData) return;
  for (const s of avData.sessions) {
    if ((s.files || []).some(f => f.boxFileId === boxFileId)) {
      // Record the download in the file object temporarily so dlState() returns "done"
      const btn = document.getElementById("filesbtn-" + s.id);
      if (btn) {
        // Re-render just the pills inside the button
        const label = btn.querySelector(".files-col-label");
        if (label) {
          // Update each file's pill that matches this boxFileId
          s.files.forEach(f => { if (f.boxFileId === boxFileId) f._justDownloaded = true; });
          btn.innerHTML = `<span class="files-col-label">Download Status</span>${buildRowFilePillsLive(s.files)}`;
        }
      }
      break;
    }
  }
}

function buildRowFilePillsLive(files) {
  if (!files.length) return `<span class="fs-pill fs-nofile" title="No files attached">—</span>`;
  const log = getDownloadLog();
  return files.map(f => {
    const tip    = f.fileName || f.fileType || "file";
    const lastDl = f.boxFileId && log[f.boxFileId];
    let state;
    if (f.status === "distributed")              state = "distributed";
    else if (!f.boxFileId)                       state = "nolink";
    else if (!lastDl)                            state = "new";
    else if (f.updatedAt && f.updatedAt > lastDl) state = "update";
    else                                         state = "done";
    if (state === "update")                        return `<span class="fs-pill fs-update" title="↻ Update — re-download: ${tip}">↻</span>`;
    if (state === "new")                           return `<span class="fs-pill fs-new"    title="⬇ Download needed: ${tip}">⬇</span>`;
    if (state === "distributed" || state==="done") return `<span class="fs-pill fs-done"   title="✓ Downloaded: ${tip}">✓</span>`;
    if (f.status === "onhold")                     return `<span class="fs-pill fs-hold"   title="⏸ On Hold: ${tip}">⏸</span>`;
    return `<span class="fs-pill fs-nofile" title="${tip}">—</span>`;
  }).join("");
}

function switchDay(day) {
  document.querySelectorAll(".day-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.day === day);
  });
  document.querySelectorAll(".day-panel").forEach(p => {
    p.classList.toggle("active", p.id === "panel-" + day);
  });
}

// ── Helpers ────────────────────────────────────────────────
function esc(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtTs(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit",hour12:true});
}
function fmtDateShort(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
}
